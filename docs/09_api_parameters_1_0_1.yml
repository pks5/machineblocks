  - name: holeYInsetDepth
    group: technic_holes_y
    type: float
    unit: mbu
    default: 0.5
    ai_usage: rarely
    description: |
      Depth of the inset ring around Technic holes in Y-direction.
    constraints:
      requires:
        - parameter: holeY
          condition: "holeY is not false"

  - name: holeYInsetDepthAdjustment
    group: technic_holes_y
    type: float
    unit: mm
    default: 0.0
    ai_usage: config_only
    description: |
      Calibration adjustment for holeYInsetDepth.

  - name: holeYGridOffsetZ
    group: technic_holes_y
    type: float
    unit: mbu
    default: 3.625
    ai_usage: rarely
    description: |
      Distance from the block bottom to the center of the first row
      of Technic holes in Y-direction.
    constraints:
      requires:
        - parameter: holeY
          condition: "holeY is not false"

  - name: holeYGridOffsetZAdjustment
    group: technic_holes_y
    type: float
    unit: mm
    default: 0.0
    ai_usage: config_only
    description: |
      Calibration adjustment for holeYGridOffsetZ.

  - name: holeYGridSizeZ
    group: technic_holes_y
    type: float
    unit: mbu
    default: 6
    ai_usage: rarely
    description: |
      Center-to-center distance between two rows of Technic holes
      in Y-direction.
    constraints:
      requires:
        - parameter: holeY
          condition: "holeY is not false"

  - name: holeYGridSizeZAdjustment
    group: technic_holes_y
    type: float
    unit: mm
    default: 0.0
    ai_usage: config_only
    description: |
      Calibration adjustment for holeYGridSizeZ.

  - name: holeYMinTopMargin
    group: technic_holes_y
    type: float
    unit: mbu
    default: 0.5
    ai_usage: rarely
    description: |
      Minimum distance between the block top and the topmost row of
      Technic holes in Y-direction. Determines whether a row is drawn.
    constraints:
      requires:
        - parameter: holeY
          condition: "holeY is not false"

  - name: holeYPartial
    group: technic_holes_y
    type: enum
    values: ["none", "start", "end", "all"]
    unit: dimensionless
    default: "none"
    ai_usage: yes
    description: |
      Whether partial (half) Technic holes are drawn in Y-direction.
      Only relevant when holeYShift=false.
      start: half hole before the first stud.
      end: half hole after the last stud.
      all: both sides.
      Also relevant for odd size.y where the last hole may be partial.
    constraints:
      requires:
        - parameter: holeY
          condition: "holeY is not false"

  # --------------------------------------------------------------------------
  # GROUP: Technic Holes Z
  # --------------------------------------------------------------------------

  - name: holeZ
    group: technic_holes_z
    type: bool_or_array
    format: |
      Boolean or selective array (same format as pillars/studs).
      Last value in selective array can be "pin"|"axle"|true|false.
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether LEGO Technic holes are drawn along the Z-axis.
      No grid parameters (grid is fixed for Z). No inset for Z holes.

  - name: holeZType
    group: technic_holes_z
    type: enum
    values: ["pin", "axle"]
    unit: dimensionless
    default: "pin"
    ai_usage: yes
    description: |
      Type of Technic holes in Z-direction.
      pin: round holes. axle: cross-shaped holes.
    constraints:
      requires:
        - parameter: holeZ
          condition: "holeZ is not false"

  - name: holeZShift
    group: technic_holes_z
    type: bool
    unit: dimensionless
    default: true
    ai_usage: yes
    description: |
      Whether Technic holes in Z-direction are shifted by 1/2 stud.
      true: holes align with studs.
      false: holes sit between two studs.
    constraints:
      requires:
        - parameter: holeZ
          condition: "holeZ is not false"

  - name: holeZDiameter
    group: technic_holes_z
    type: float_or_auto
    unit: mbu
    default: "auto"
    ai_usage: rarely
    description: |
      Diameter of Technic holes in Z-direction.
      Automatically calculated.
    constraints:
      requires:
        - parameter: holeZ
          condition: "holeZ is not false"

  - name: holeZDiameterAdjustment
    group: technic_holes_z
    type: float
    unit: mm
    default: 0.3
    ai_usage: config_only
    description: |
      Calibration adjustment for holeZDiameter.

  - name: holeZPartialX
    group: technic_holes_z
    type: enum
    values: ["none", "start", "end", "all"]
    unit: dimensionless
    default: "none"
    ai_usage: yes
    description: |
      Whether partial (half) Z-holes are drawn in X-direction.
      start: half hole at the x- edge.
      end: half hole at the x+ edge.
      all: both sides.
    constraints:
      requires:
        - parameter: holeZ
          condition: "holeZ is not false"

  - name: holeZPartialY
    group: technic_holes_z
    type: enum
    values: ["none", "start", "end", "all"]
    unit: dimensionless
    default: "none"
    ai_usage: yes
    description: |
      Whether partial (half) Z-holes are drawn in Y-direction.
      start: half hole at the y- edge.
      end: half hole at the y+ edge.
      all: both sides.
    constraints:
      requires:
        - parameter: holeZ
          condition: "holeZ is not false"

  # --------------------------------------------------------------------------
  # GROUP: Hole Axle
  # --------------------------------------------------------------------------

  - name: holeAxleThickness
    group: technic_holes
    type: float
    unit: mbu
    default: 1
    ai_usage: rarely
    description: |
      Thickness of one strut of the cross axle for hole*Type="axle".
      Applies to all axes (X, Y, Z).
    constraints:
      requires:
        - condition: "Any of holeXType, holeYType, or holeZType = 'axle'"

  # --------------------------------------------------------------------------
  # GROUP: Studs
  # --------------------------------------------------------------------------

  - name: studs
    group: studs
    type: bool_or_array
    format: |
      Boolean or selective array (same format as pillars).
      Last value in selective array can be "hollow"|"solid"|true|false.
    unit: dimensionless
    default: true
    ai_usage: yes
    description: |
      Whether studs are drawn. Selective array allows per-region control
      including stud type override.

  - name: studType
    group: studs
    type: enum
    values: ["solid", "hollow"]
    unit: dimensionless
    default: "solid"
    ai_usage: yes
    description: |
      Type of studs. solid: massive. hollow: with a hole in the center.

  - name: studShift
    group: studs
    type: bool
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether studs are shifted by 1/2 stud in X and Y.
      false: studs sit between pillars.
      true: studs sit directly above pillars.

  - name: studMaxOverhang
    group: studs
    type: float
    unit: mbu
    default: 0.3
    ai_usage: rarely
    description: |
      Maximum allowed stud overhang beyond the outer edge.
      Studs exceeding this are not drawn.

  - name: studPadding
    group: studs
    type: float_or_array
    format: |
      Float: all 4 sides equal.
      2-element array [X, Y]: X for x-(0) and x+(1), Y for y-(2) and y+(3).
      4-element array [x-(0), x+(1), y-(2), y+(3)]: each side individually.
    unit: unitGrid
    default: 0
    ai_usage: yes
    description: |
      Padding from sides 0-3 inward. Shifts the outer wall for the decision
      whether studs are drawn, allowing outer studs to be hidden.

  - name: studClampHeight
    group: studs
    type: float
    unit: mbu
    default: 0.5
    ai_usage: yes
    description: |
      Height of the stud clamp ring at the upper stud edge.
      Creates a near-permanent connection between two bricks.
      Only active when studClampThickness > 0.
    constraints:
      requires:
        - parameter: studClampThickness
          condition: "studClampThickness > 0"

  - name: studClampThickness
    group: studs
    type: float
    unit: mbu
    default: 0.0
    ai_usage: yes
    description: |
      Thickness of the stud clamp ring. At 0 no clamp is active.

  - name: studHoleDiameter
    group: studs
    type: float_or_auto
    unit: mbu
    default: "auto"
    ai_usage: rarely
    description: |
      Diameter of the hole in studs (studType=hollow).
      Automatically calculated.
    constraints:
      requires:
        - parameter: studType
          condition: "studType = 'hollow'"

  - name: studHoleDiameterAdjustment
    group: studs
    type: float
    unit: mm
    default: 0.3
    ai_usage: config_only
    description: |
      Calibration adjustment for studHoleDiameter.

  - name: studHoleClampThickness
    group: studs
    type: float
    unit: mm
    default: 0.1
    ai_usage: rarely
    description: |
      Thickness of the clamp inside the stud hole (studType=hollow).
      A constriction of the inner hole so pins/axles grip in the stud.
    constraints:
      requires:
        - parameter: studType
          condition: "studType = 'hollow'"

  - name: studRounding
    group: studs
    type: float
    unit: mbu
    default: 0.0625
    ai_usage: rarely
    description: |
      Rounding radius of the upper stud edge.

  - name: studDiameter
    group: studs
    type: float
    unit: mbu
    default: 3
    ai_usage: rarely
    description: |
      Diameter of studs. Usually does not need adjustment.

  - name: studDiameterAdjustment
    group: studs
    type: float
    unit: mm
    default: 0.2
    ai_usage: config_only
    description: |
      Calibration adjustment for studDiameter.

  - name: studHeight
    group: studs
    type: float
    unit: mbu
    default: 1
    ai_usage: rarely
    description: |
      Height of studs. Usually does not need adjustment.

  - name: studHeightAdjustment
    group: studs
    type: float
    unit: mm
    default: 0.0
    ai_usage: config_only
    description: |
      Calibration adjustment for studHeight.

  - name: studCutoutAdjustment
    group: studs
    type: array
    format: "[width, height]"
    unit: mm
    default: [0.2, 0.4]
    ai_usage: config_only
    description: |
      Calibration of stud cutout dimensions (width and height).
      Affects cutouts for studs in baseCutoutType=studs and outer wall
      cutouts in round bricks for grid compatibility. Calibration only.

  # --------------------------------------------------------------------------
  # GROUP: Stud Icon
  # --------------------------------------------------------------------------

  - name: studIcon
    group: stud_icon
    type: string
    unit: dimensionless
    default: "../pattern/bolt-solid-full.svg"
    ai_usage: yes
    description: |
      SVG file engraved into each stud.

  - name: studIconDimensions
    group: stud_icon
    type: array
    format: "[width, height]"
    unit: mm
    default: [169.333, 169.333]
    ai_usage: yes
    description: |
      Dimensions of the stud icon SVG in mm (from the SVG file).
      Default values match all standard icons in the /patterns directory.

  - name: studIconScale
    group: stud_icon
    type: float
    unit: dimensionless
    default: 0.024
    ai_usage: yes
    description: |
      Effective scale factor for the stud icon.

  - name: studIconDepth
    group: stud_icon
    type: float
    unit: mm
    default: -0.2
    ai_usage: yes
    description: |
      Depth of the icon engraving. Negative = engraved into the stud.
      Positive = raised above the stud.

  - name: studIconColor
    group: stud_icon
    type: color_or_inherit
    unit: dimensionless
    default: "inherit"
    ai_usage: yes
    description: |
      Color of the stud icon. "inherit" uses baseColor.
      Only visually relevant when studIconDepth > 0.

  # --------------------------------------------------------------------------
  # GROUP: Tongue / Groove
  # --------------------------------------------------------------------------

  - name: tongue
    group: tongue_groove
    type: bool
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether a tongue (ridge) is drawn. Counterpart to baseCutoutType=groove.
      Tongue and groove are an alternative attachment system for joining two
      bricks, typically to create a solid block from two separate parts.
      The tongue wraps around the outermost ring of studs and is compatible
      with a plate of the same size, but typically used with a groove brick.
      Can be used with or without recess.

  - name: tongueHeight
    group: tongue_groove
    type: float
    unit: mbu
    default: 1.25
    ai_usage: rarely
    description: |
      Height of the tongue.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  - name: tongueGrooveDepth
    group: tongue_groove
    type: float
    unit: mbu
    default: 1.5
    ai_usage: rarely
    description: |
      Depth of the groove. Typically slightly deeper than the tongue height
      to allow for tolerances.
    constraints:
      requires:
        - parameter: baseCutoutType
          condition: "baseCutoutType = 'groove'"

  - name: tongueRoundingRadius
    group: tongue_groove
    type: float_or_auto
    unit: unitGrid
    default: "auto"
    ai_usage: rarely
    description: |
      Rounding radius of the tongue. Typically derived from the block's
      rounding radius. Usually does not need adjustment.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  - name: tongueInnerRoundingRadius
    group: tongue_groove
    type: float_or_auto
    unit: unitGrid
    default: "auto"
    ai_usage: rarely
    description: |
      Rounding radius of the inner side of the tongue. Derived from
      tongueRoundingRadius. Usually does not need adjustment.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  - name: tongueThickness
    group: tongue_groove
    type: float
    unit: mbu
    default: 0.666
    ai_usage: rarely
    description: |
      Thickness of the tongue.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  - name: tongueThicknessAdjustment
    group: tongue_groove
    type: float
    unit: mm
    default: 0
    ai_usage: config_only
    description: |
      Calibration adjustment for tongue thickness. Used to adjust tolerance
      between tongue and groove if connection is too tight.

  - name: tongueOffset
    group: tongue_groove
    type: float
    unit: mbu
    default: 1
    ai_usage: rarely
    description: |
      Distance of the tongue from the side edge.
      Corresponds to the distance of studs from the side edge.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  - name: tongueClampHeight
    group: tongue_groove
    type: float
    unit: mbu
    default: 0.5
    ai_usage: rarely
    description: |
      Height of the tongue clamp lip. Affects both the lip on the tongue
      and the matching recess in the groove for snapping together.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  - name: tongueClampOffset
    group: tongue_groove
    type: float
    unit: mbu
    default: 0.25
    ai_usage: rarely
    description: |
      Distance of the clamp lip from the upper edge of the tongue.
      Also affects the position of the matching recess in the groove.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  - name: tongueClampThickness
    group: tongue_groove
    type: float
    unit: mm
    default: 0.1
    ai_usage: rarely
    description: |
      Thickness of the tongue clamp lip / groove recess.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  # --------------------------------------------------------------------------
  # GROUP: Grille
  # --------------------------------------------------------------------------

  - name: grille
    group: grille
    type: enum
    values: ["none", "x", "y"]
    unit: dimensionless
    default: "none"
    ai_usage: yes
    description: |
      Whether the top plate is rendered as a grille with regular openings.
      "x" or "y" defines the direction of the grille bars.

  - name: grilleInverted
    group: grille
    type: bool
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether the grille starts with an opening instead of a solid bar.
    constraints:
      requires:
        - parameter: grille
          condition: "grille is not 'none'"

  - name: grilleDepth
    group: grille
    type: float
    unit: mbu
    default: 1
    ai_usage: yes
    description: |
      Depth of the grille openings.
    constraints:
      requires:
        - parameter: grille
          condition: "grille is not 'none'"

  - name: grilleCount
    group: grille
    type: int
    unit: dimensionless
    default: 5
    ai_usage: yes
    description: |
      Number of grille bars across the entire surface.
    constraints:
      requires:
        - parameter: grille
          condition: "grille is not 'none'"

  # --------------------------------------------------------------------------
  # GROUP: Recess
  # --------------------------------------------------------------------------

  - name: recess
    group: recess
    type: bool
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether a top-down cavity is created, forming a box with four walls
      and no lid. When active with baseCutoutType=standard, the baseCutout
      depth is reduced to minimum (1 mbu) if recessDepth=auto.

  - name: recessRoundingRadius
    group: recess
    type: float_or_auto
    unit: unitGrid
    default: "auto"
    ai_usage: rarely
    description: |
      Rounding radius of the recess cavity. Derived from the block's
      rounding radius. Usually does not need adjustment.
    constraints:
      requires:
        - parameter: recess
          condition: "recess = true"

  - name: recessDepth
    group: recess
    type: float_or_auto
    unit: mbu
    default: "auto"
    ai_usage: yes
    description: |
      Depth of the recess cavity. At "auto" depth is maximized.
      When set to an absolute value, the baseCutout (standard) goes up to
      baseCutoutMaxDepth and the remainder is filled with the top plate
      wall between baseCutout and recess.
    constraints:
      requires:
        - parameter: recess
          condition: "recess = true"

  - name: recessWallThickness
    group: recess
    type: float_or_array
    format: |
      Float: all 4 sides equal.
      2-element array [X, Y]: X for x-(0) and x+(1), Y for y-(2) and y+(3).
      4-element array [x-(0), x+(1), y-(2), y+(3)]: each side individually.
    unit: unitGrid
    default: 0.333
    ai_usage: yes
    description: |
      Wall thickness of the recess cavity (box wall thickness).
    constraints:
      requires:
        - parameter: recess
          condition: "recess = true"

  - name: recessStuds
    group: recess
    type: bool
    unit: dimensionless
    default: true
    ai_usage: yes
    description: |
      Whether studs are drawn on the recess floor. Studs are at the same
      X/Y position as without recess. Only drawn if a 1x1 brick fits —
      studs too close to the recess wall are hidden.
    constraints:
      requires:
        - parameter: recess
          condition: "recess = true"

  - name: recessStudPadding
    group: recess
    type: float_or_array
    format: |
      Float: all 4 sides equal.
      2-element array [X, Y]: X for x-(0) and x+(1), Y for y-(2) and y+(3).
      4-element array [x-(0), x+(1), y-(2), y+(3)]: each side individually.
    unit: unitGrid
    default: 0.2
    ai_usage: yes
    description: |
      Padding from the recess wall inward. Determines whether outer studs
      in the recess are hidden. Studs whose center is closer to the recess
      wall than this padding value are not drawn.
    constraints:
      requires:
        - parameter: recessStuds
          condition: "recessStuds = true"

  - name: recessStudType
    group: recess
    type: enum
    values: ["solid", "hollow"]
    unit: dimensionless
    default: "solid"
    ai_usage: yes
    description: |
      Type of studs on the recess floor.
      solid: massive studs. hollow: studs with a hole in the center.
    constraints:
      requires:
        - parameter: recessStuds
          condition: "recessStuds = true"

  - name: recessStudShift
    group: recess
    type: bool
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether recess floor studs are shifted by 1/2 stud in X and Y.
      false: studs sit at standard positions.
      true: studs are shifted by half a stud in both directions.
    constraints:
      requires:
        - parameter: recessStuds
          condition: "recessStuds = true"

  - name: recessWallGaps
    group: recess
    type: array
    format: "[[side, offset_left, offset_right], ...]"
    unit: "side: side index (0-3), offsets: unitGrid"
    default: []
    ai_usage: yes
    description: |
      Openings in recess walls. Each entry specifies a side and left/right
      offsets to create partial or full wall openings.
      Also creates matching openings in tongue and groove.
    constraints:
      requires:
        - parameter: recess
          condition: "recess = true"
      affects:
        - tongue
        - baseCutoutType (groove)
    example: |
      [[2,1,2], [3,0,1]] — opening on side 2 with 1 stud left offset
      and 2 studs right offset; opening on side 3 with 0 left and 1 right.

  # --------------------------------------------------------------------------
  # GROUP: Text
  # --------------------------------------------------------------------------

  - name: text
    group: text
    type: string
    unit: dimensionless
    default: ""
    ai_usage: yes
    description: |
      Text to draw on the brick. If not empty, rendered on the side
      specified by textSide.

  - name: textSide
    group: text
    type: int
    values: [0, 1, 2, 3, 4, 5]
    unit: dimensionless
    default: 0
    ai_usage: yes
    description: |
      Side of the brick on which text is displayed (0-5).
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  - name: textDepth
    group: text
    type: float
    unit: mbu
    default: -0.25
    ai_usage: yes
    description: |
      Depth/height of the text. Negative = engraved. Positive = raised.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  - name: textFont
    group: text
    type: string
    unit: dimensionless
    default: "Liberation Sans"
    ai_usage: yes
    description: |
      Font family for the text.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  - name: textSize
    group: text
    type: float
    unit: pt
    default: 4
    ai_usage: yes
    description: |
      Font size of the text.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  - name: textSpacing
    group: text
    type: float
    unit: pt
    default: 1
    ai_usage: yes
    description: |
      Letter spacing of the text.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  - name: textVerticalAlign
    group: text
    type: enum
    values: ["left", "right", "center"]
    unit: dimensionless
    default: "center"
    ai_usage: yes
    description: |
      Vertical alignment of the text on the brick surface.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  - name: textHorizontalAlign
    group: text
    type: enum
    values: ["left", "right", "center"]
    unit: dimensionless
    default: "center"
    ai_usage: yes
    description: |
      Horizontal alignment of the text on the brick surface.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  - name: textOffset
    group: text
    type: array
    format: "[x, y]"
    unit: unitGrid
    default: [0, 0]
    ai_usage: yes
    description: |
      Offset of the text from its normal position.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  - name: textColor
    group: text
    type: color
    format: "Hex RGB '#ff00ff', Hex RGBA '#ff00ffaa', or RGBA float array [0..1, 0..1, 0..1, 0..1]"
    unit: dimensionless
    default: "#2c3e50"
    ai_usage: yes
    description: |
      Color of the text. Independent from baseColor.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  # --------------------------------------------------------------------------
  # GROUP: Surface Pattern
  # --------------------------------------------------------------------------

  - name: surfacePattern
    group: surface_pattern
    type: string
    unit: dimensionless
    default: "none"
    ai_usage: yes
    description: |
      SVG file for a pattern on the brick surface. Applied to the brick
      body surface as a repeating or single pattern.

  - name: surfacePatternDimensions
    group: surface_pattern
    type: array
    format: "[width, height]"
    unit: mm
    default: [451.556, 451.556]
    ai_usage: yes
    description: |
      Dimensions of the surface pattern SVG in mm (from the SVG file).
    constraints:
      requires:
        - parameter: surfacePattern
          condition: "surfacePattern is not 'none'"

  - name: surfacePatternOffset
    group: surface_pattern
    type: array
    format: "[x, y]"
    unit: unitGrid
    default: [0, 0]
    ai_usage: yes
    description: |
      Offset of the surface pattern.
    constraints:
      requires:
        - parameter: surfacePattern
          condition: "surfacePattern is not 'none'"

  - name: surfacePatternScale
    group: surface_pattern
    type: float
    unit: dimensionless
    default: 0.25
    ai_usage: yes
    description: |
      Scale factor for the surface pattern.
    constraints:
      requires:
        - parameter: surfacePattern
          condition: "surfacePattern is not 'none'"

  - name: surfacePatternDepth
    group: surface_pattern
    type: float
    unit: mm
    default: -0.2
    ai_usage: yes
    description: |
      Depth of the surface pattern. Negative = engraved. Positive = raised.
    constraints:
      requires:
        - parameter: surfacePattern
          condition: "surfacePattern is not 'none'"

  - name: surfacePatternColor
    group: surface_pattern
    type: color_or_inherit
    unit: dimensionless
    default: "inherit"
    ai_usage: yes
    description: |
      Color of the surface pattern. "inherit" uses baseColor.
      Only visually relevant when surfacePatternDepth > 0.
    constraints:
      requires:
        - parameter: surfacePattern
          condition: "surfacePattern is not 'none'"

  # --------------------------------------------------------------------------
  # GROUP: SVG
  # --------------------------------------------------------------------------

  - name: svg
    group: svg
    type: string
    unit: dimensionless
    default: ""
    ai_usage: yes
    description: |
      SVG file to draw on a brick side. Placed on the side specified
      by svgSide.

  - name: svgSide
    group: svg
    type: int
    values: [0, 1, 2, 3, 4, 5]
    unit: dimensionless
    default: 5
    ai_usage: yes
    description: |
      Side on which the SVG is drawn (0-5).
    constraints:
      requires:
        - parameter: svg
          condition: "svg is not empty"

  - name: svgDepth
    group: svg
    type: float
    unit: mbu
    default: 0.4
    ai_usage: yes
    description: |
      Depth/height of the SVG. Negative = engraved. Positive = raised.
    constraints:
      requires:
        - parameter: svg
          condition: "svg is not empty"

  - name: svgDimensions
    group: svg
    type: array
    format: "[width, height]"
    unit: mm
    default: [100, 100]
    ai_usage: yes
    description: |
      Dimensions of the SVG in mm (from the SVG file).
    constraints:
      requires:
        - parameter: svg
          condition: "svg is not empty"

  - name: svgScale
    group: svg
    type: float
    unit: dimensionless
    default: 1.0
    ai_usage: yes
    description: |
      Scale factor for the SVG.
    constraints:
      requires:
        - parameter: svg
          condition: "svg is not empty"

  - name: svgOffset
    group: svg
    type: array
    format: "[x, y]"
    unit: unitGrid
    default: [0, 0]
    ai_usage: yes
    description: |
      Offset of the SVG from its default position.
    constraints:
      requires:
        - parameter: svg
          condition: "svg is not empty"

  - name: svgColor
    group: svg
    type: color
    format: "Hex RGB '#ff00ff', Hex RGBA '#ff00ffaa', or RGBA float array [0..1, 0..1, 0..1, 0..1]"
    unit: dimensionless
    default: "#2c3e50"
    ai_usage: yes
    description: |
      Color of the SVG.
    constraints:
      requires:
        - parameter: svg
          condition: "svg is not empty"

  # --------------------------------------------------------------------------
  # GROUP: Connectors
  # --------------------------------------------------------------------------

  - name: connectors
    group: connectors
    type: bool_or_array
    format: |
      false: no connectors.
      Array of 2-element arrays: [[side, arrangement], ...]
      - side: side number (0-3)
      - arrangement:
        0: protruding triangles, tip at wall, wide side outward, full brick height
        1: recess, wide side inward, tip outward — counterpart to 0 for
           connecting two bricks side by side (0°)
        2: recess, wide side up, tip down — for 90° downward connection
        3: recess, wide side down, tip up — for 90° upward connection
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Side connection system using triangles. Alternative to tongue/groove
      which connects vertically. Connectors enable side-by-side and
      angled (90°) connections.

  - name: connectorPadding
    group: connectors
    type: array
    format: "[start, end]"
    unit: "number of triangles"
    default: [0, 0]
    ai_usage: yes
    description: |
      How many triangles to skip at the start and end of a side.
      Important when connecting bricks of different sizes.
    constraints:
      requires:
        - parameter: connectors
          condition: "connectors is not false"

  - name: connectorHeight
    group: connectors
    type: float_or_auto
    unit: mbu
    default: "auto"
    ai_usage: yes
    description: |
      Height of the connector triangles. At "auto" equals the brick height.
    constraints:
      requires:
        - parameter: connectors
          condition: "connectors is not false"

  - name: connectorDepth
    group: connectors
    type: float
    unit: mbu
    default: 0.75
    ai_usage: yes
    description: |
      How far the connector triangles protrude.
    constraints:
      requires:
        - parameter: connectors
          condition: "connectors is not false"

  - name: connectorWidth
    group: connectors
    type: float
    unit: mbu
    default: 2.5
    ai_usage: yes
    description: |
      Width of the connector triangles.
    constraints:
      requires:
        - parameter: connectors
          condition: "connectors is not false"

  - name: connectorDepthTolerance
    group: connectors
    type: float
    unit: mm
    default: 0.2
    ai_usage: rarely
    description: |
      Tolerance of the recess depth relative to the triangle depth.
    constraints:
      requires:
        - parameter: connectors
          condition: "connectors is not false"

  - name: connectorSideTolerance
    group: connectors
    type: float
    unit: mm
    default: 0.1
    ai_usage: rarely
    description: |
      Tolerance of the recess width relative to the triangle width.
    constraints:
      requires:
        - parameter: connectors
          condition: "connectors is not false"

  # --------------------------------------------------------------------------
  # GROUP: Screw Holes X / Y
  # --------------------------------------------------------------------------

  - name: screwHolesX
    group: screw_holes
    type: array
    format: "[[x, z], ...] or [[x, z, side], ...]"
    unit: unitGrid
    default: []
    ai_usage: yes
    description: |
      Mounting holes along the X-axis.
      - x, z: position in unitGrid
      - side: 0 = x- side, 1 = x+ side, undef = both sides

  - name: screwHoleXSize
    group: screw_holes
    type: float
    unit: mm
    default: 2.1
    ai_usage: yes
    description: |
      Diameter of X-axis mounting holes.
    constraints:
      requires:
        - parameter: screwHolesX
          condition: "screwHolesX is not empty"

  - name: screwHoleXDepth
    group: screw_holes
    type: float
    unit: mm
    default: 4
    ai_usage: yes
    description: |
      Depth of X-axis mounting holes.
    constraints:
      requires:
        - parameter: screwHolesX
          condition: "screwHolesX is not empty"

  - name: screwHolesY
    group: screw_holes
    type: array
    format: "[[y, z], ...] or [[y, z, side], ...]"
    unit: unitGrid
    default: []
    ai_usage: yes
    description: |
      Mounting holes along the Y-axis.
      - y, z: position in unitGrid
      - side: 0 = y- side, 1 = y+ side, undef = both sides

  - name: screwHoleYSize
    group: screw_holes
    type: float
    unit: mm
    default: 2.1
    ai_usage: yes
    description: |
      Diameter of Y-axis mounting holes.
    constraints:
      requires:
        - parameter: screwHolesY
          condition: "screwHolesY is not empty"

  - name: screwHoleYDepth
    group: screw_holes
    type: float
    unit: mm
    default: 4
    ai_usage: yes
    description: |
      Depth of Y-axis mounting holes.
    constraints:
      requires:
        - parameter: screwHolesY
          condition: "screwHolesY is not empty"

  # --------------------------------------------------------------------------
  # GROUP: Screw Holes Z
  # --------------------------------------------------------------------------

  - name: screwHolesZ
    group: screw_holes
    type: array
    format: "[[x, y], ...]"
    unit: unitGrid
    default: []
    ai_usage: yes
    description: |
      Mounting holes in Z-direction on the top plate (baseCutoutType=standard)
      or solid brick (baseCutoutType=none). Positions correspond to where
      studs are or would be.

  - name: screwHoleZSize
    group: screw_holes
    type: float
    unit: mm
    default: 2.3
    ai_usage: yes
    description: |
      Diameter of Z-axis mounting holes.
    constraints:
      requires:
        - parameter: screwHolesZ
          condition: "screwHolesZ is not empty"

  - name: screwHoleZHelperThickness
    group: screw_holes
    type: float
    unit: mm
    default: 0.8
    ai_usage: rarely
    description: |
      Thickness of helpers for Z-axis mounting holes on the underside.
      Required for baseCutoutType=standard to avoid needing print support.
    constraints:
      requires:
        - parameter: screwHolesZ
          condition: "screwHolesZ is not empty"

  - name: screwHoleZHelperOffset
    group: screw_holes
    type: float
    unit: mm
    default: 0.2
    ai_usage: rarely
    description: |
      Offset between the two helper layers for Z-axis mounting holes.
    constraints:
      requires:
        - parameter: screwHolesZ
          condition: "screwHolesZ is not empty"

  - name: screwHoleZHelperHeight
    group: screw_holes
    type: float
    unit: mm
    default: 0.2
    ai_usage: rarely
    description: |
      Height of the helper layers for Z-axis mounting holes.
    constraints:
      requires:
        - parameter: screwHolesZ
          condition: "screwHolesZ is not empty"

  # --------------------------------------------------------------------------
  # GROUP: PCB
  # --------------------------------------------------------------------------

  - name: pcb
    group: pcb
    type: bool
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether the brick includes PCB mounting features.

  - name: pcbMountingType
    group: pcb
    type: enum
    values: ["clips", "screws"]
    unit: dimensionless
    default: "clips"
    ai_usage: yes
    description: |
      Type of PCB mounting.
      clips: frame for clipping in the PCB.
      screws: screw sockets for screw mounting.
    constraints:
      requires:
        - parameter: pcb
          condition: "pcb = true"

  - name: pcbDimensions
    group: pcb
    type: array
    format: "[x, y, z]"
    unit: mm
    default: [20, 30, 3]
    ai_usage: yes
    description: |
      Dimensions of the PCB in mm. Refers to the board size,
      especially relevant for pcbMountingType=clips.
    constraints:
      requires:
        - parameter: pcb
          condition: "pcb = true"

  - name: pcbOffset
    group: pcb
    type: array
    format: "[x, y]"
    unit: unitGrid
    default: [0, 0]
    ai_usage: yes
    description: |
      Offset of the PCB from the center of the brick.
    constraints:
      requires:
        - parameter: pcb
          condition: "pcb = true"

  - name: pcbScrewSocketSize
    group: pcb
    type: float
    unit: mm
    default: 5
    ai_usage: yes
    description: |
      Diameter of screw sockets.
    constraints:
      requires:
        - parameter: pcbMountingType
          condition: "pcbMountingType = 'screws'"

  - name: pcbScrewSocketHoleSize
    group: pcb
    type: float
    unit: mm
    default: 2.2
    ai_usage: yes
    description: |
      Diameter of the screw hole inside the socket.
    constraints:
      requires:
        - parameter: pcbMountingType
          condition: "pcbMountingType = 'screws'"

  - name: pcbScrewSocketHeight
    group: pcb
    type: float
    unit: mm
    default: 3
    ai_usage: yes
    description: |
      Height of the screw sockets.
    constraints:
      requires:
        - parameter: pcbMountingType
          condition: "pcbMountingType = 'screws'"

  - name: pcbScrewSockets
    group: pcb
    type: array
    format: "[[x, y], ...]"
    unit: mm
    default: []
    ai_usage: yes
    description: |
      Positions of screw sockets. Each entry gives the distance of the
      socket center from the brick center in mm.
    constraints:
      requires:
        - parameter: pcbMountingType
          condition: "pcbMountingType = 'screws'"

  # --------------------------------------------------------------------------
  # GROUP: Quality / Rendering
  # --------------------------------------------------------------------------

  - name: qualitySegBase
    group: quality
    type: float
    unit: mm
    default: 1.2
    ai_usage: rarely
    description: |
      Base mm per segment for quality calculation.

  - name: qualityFactor
    group: quality
    type: array
    format: "[functional, visual, other, draft]"
    unit: dimensionless
    default: [0.6, 1.0, 1.6, 2.5]
    ai_usage: rarely
    description: |
      Quality factors for 4 rounding groups: functional, visual, other, draft.
      Basis for calculating rounding resolution from radius and group.

  - name: qualityResolutionMin
    group: quality
    type: array
    format: "[functional, visual, other, draft]"
    unit: dimensionless
    default: [24, 18, 12, 8]
    ai_usage: rarely
    description: |
      Minimum resolution ($fn) per quality group.

  - name: qualityResolutionMax
    group: quality
    type: int
    unit: dimensionless
    default: 220
    ai_usage: rarely
    description: |
      Global maximum resolution ($fn).

  - name: qualityResolutionMultiplier
    group: quality
    type: float
    unit: dimensionless
    default: 0.25
    ai_usage: rarely
    description: |
      Global quality factor. Lower = higher quality.

  - name: previewQuality
    group: quality
    type: float
    unit: dimensionless
    default: 0.5
    ai_usage: rarely
    description: |
      Factor that reduces quality in OpenSCAD preview mode.

  - name: previewRender
    group: quality
    type: bool
    unit: dimensionless
    default: false
    ai_usage: rarely

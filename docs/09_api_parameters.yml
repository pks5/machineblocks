  # --------------------------------------------------------------------------
  # GROUP: Side / Height Adjustment (Calibration)
  # --------------------------------------------------------------------------

  - name: baseSideAdjustment
    group: calibration
    type: float_or_array
    format: |
      Float: all 4 sides equal.
      2-element array [X, Y]: X for x-(0) and x+(1), Y for y-(2) and y+(3).
      4-element array [x-(0), x+(1), y-(2), y+(3)]: each side individually.
    unit: mm
    default: -0.1
    ai_usage: yes
    description: |
      Extends or reduces each side (0–3 only, no Z) by the given amount in mm.
      Never scales with the scale parameter.

      PRIMARY PURPOSE — Calibration:
      Consumer-grade 3D printers typically print slightly too wide or have layers
      that protrude slightly. This causes adjacent blocks to not fit together.
      baseSideAdjustment compensates for this: a negative value (e.g. -0.1mm)
      slightly reduces all sides, ensuring blocks fit together correctly.

      IN CONFIG — always use a single uniform value:
      When set in mb_config, all 4 values must be equal. Composite blocks can
      have more than 4 logical sides, so only the first value is ever used by
      composite block implementations. Different values in config would be silently
      ignored or misapplied. This is a best-practice rule, not a hard library
      constraint.

        Allowed in config:   -0.1  or  [-0.1, -0.1]  or  [-0.1, -0.1, -0.1, -0.1]
        Not allowed in config: [-0.1, 0.1, 0, -0.1]

      IN SETTINGS (mb_block primitives) — all 4 values may differ:
      When passed directly to mb_block() calls inside a composite block module,
      each side can have a different value. This is the correct and required pattern
      for composite block implementations, which must manually build the
      baseSideAdjustment array for each primitive to:
        - Apply the calibration value (from baseSideAdjustment[0]) to outer sides
        - Apply a small positive overlap (e.g. 0.01mm) to internal contact sides,
          ensuring adjacent primitives actually touch and form a solid union in
          OpenSCAD. Without this overlap, a negative baseSideAdjustment would
          create a visible gap or zero-thickness wall between parts.

      Side indices always refer to west orientation regardless of the primitive's
      direction. When a primitive is rotated (e.g. direction = "east" = 180°),
      the side indices must be remapped accordingly in the composite block.

      baseSideAdjustment is applied to all geometry including rounded corners and
      bevel shapes — those are automatically adjusted to match.

  - name: baseHeightAdjustment
    group: calibration
    type: array
    format: "[z-, z+] — always a 2-element array in mm"
    unit: mm
    default: [0.0, 0.0]
    since: "2"
    status: stable
    ai_usage: config_only
    description: |
      Calibration adjustment for block height, applied separately to bottom (z-)
      and top (z+) faces. Compensates height inaccuracies in 3D printing.
      The first value adjusts the bottom (z-, side 4), typically 0.
      The second value adjusts the top (z+, side 5), e.g. -0.1 to reduce height.

      Example: A brick that should be 3.2mm but prints at 3.3mm can be
      corrected with [0, -0.1].

      When used in composite blocks stacked vertically, the top block can set
      baseHeightAdjustment to [-0.1, 0] (or [-0.105, 0] for slight overlap)
      to compensate for a gap created by a negative adjustment on the lower block.

      Usage in namedSideAdjustments: always pass useFirst=false so the full
      2-element array is used as the base:
        panelHeightAdjustment = mb_named_height_adjustments(
            baseHeightAdjustment,
            namedSideAdjustments,
            [["z+", "height"]]
        );

      IMPORTANT: Unlike baseSideAdjustment, no float shorthand is accepted.
      Always provide the full [z-, z+] array.
    version_history:
      - version: "2"
        description: "Single float value applied uniformly to block height."
      - version: "3.0"
        description: |
          Changed to mandatory 2-element array [z-, z+].
          Float input is no longer accepted.
          Use mb_named_height_adjustments() instead of mb_named_side_adjustments()
          for height adjustments in composite blocks.

  # --------------------------------------------------------------------------
  # GROUP: Top Plate Helpers
  # --------------------------------------------------------------------------

  - name: topPlateHelpers
    group: print_helpers
    type: bool
    unit: dimensionless
    default: true
    ai_usage: rarely
    description: |
      Whether top plate helpers are active. A small frame that slightly
      widens the inner walls of the underside opening (baseCutoutType=standard).
      Improves adhesion when printing the ceiling (top plate).
      Two layers: horizontal (X-axis) then vertical (Y-axis).
      Usually active, does not need adjustment.
    constraints:
      requires:
        - parameter: baseCutoutType
          condition: "baseCutoutType = 'standard'"

  - name: topPlateHelperHeight
    group: print_helpers
    type: float
    unit: mm
    default: 0.2
    ai_usage: rarely
    description: |
      Height of one top plate helper layer. Typically matches the 3D print
      layer height. The horizontal layer is effectively 2× this value as
      it is printed first.
    constraints:
      requires:
        - parameter: topPlateHelpers
          condition: "topPlateHelpers = true"

  - name: topPlateHelperThickness
    group: print_helpers
    type: float
    unit: mm
    default: 0.4

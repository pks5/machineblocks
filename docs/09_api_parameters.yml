      requires:
        - parameter: holeZ
          condition: "holeZ is not false"

  - name: holeZShift
    group: technic_holes_z
    type: bool
    unit: dimensionless
    default: true
    ai_usage: yes
    description: |
      Whether Technic holes in Z-direction are shifted by 1/2 stud.
      true: holes align with studs.
      false: holes sit between two studs.
    constraints:
      requires:
        - parameter: holeZ
          condition: "holeZ is not false"

  - name: holeZDiameter
    group: technic_holes_z
    type: float_or_auto
    unit: mbu
    default: "auto"
    ai_usage: rarely
    description: |
      Diameter of Technic holes in Z-direction.
      Automatically calculated.
    constraints:
      requires:
        - parameter: holeZ
          condition: "holeZ is not false"

  - name: holeZDiameterAdjustment
    group: technic_holes_z
    type: float
    unit: mm
    default: 0.3
    ai_usage: config_only
    description: |
      Calibration adjustment for holeZDiameter.

  - name: holeZPartialX
    group: technic_holes_z
    type: enum
    values: ["none", "start", "end", "all"]
    unit: dimensionless
    default: "none"
    ai_usage: yes
    description: |
      Whether partial (half) Z-holes are drawn in X-direction.
      start: half hole at the x- edge.
      end: half hole at the x+ edge.
      all: both sides.
    constraints:
      requires:
        - parameter: holeZ
          condition: "holeZ is not false"

  - name: holeZPartialY
    group: technic_holes_z
    type: enum
    values: ["none", "start", "end", "all"]
    unit: dimensionless
    default: "none"
    ai_usage: yes
    description: |
      Whether partial (half) Z-holes are drawn in Y-direction.
      start: half hole at the y- edge.
      end: half hole at the y+ edge.
      all: both sides.
    constraints:
      requires:
        - parameter: holeZ
          condition: "holeZ is not false"

  # --------------------------------------------------------------------------
  # GROUP: Hole Axle
  # --------------------------------------------------------------------------

  - name: holeAxleThickness
    group: technic_holes
    type: float
    unit: mbu
    default: 1
    ai_usage: rarely
    description: |
      Thickness of one strut of the cross axle for hole*Type="axle".
      Applies to all axes (X, Y, Z).
    constraints:
      requires:
        - condition: "Any of holeXType, holeYType, or holeZType = 'axle'"

  # --------------------------------------------------------------------------
  # GROUP: Studs
  # --------------------------------------------------------------------------

  - name: studs
    group: studs
    type: bool_or_array
    format: |
      Boolean or selective array (same format as pillars).
      Last value in selective array can be "hollow"|"solid"|true|false.
    unit: dimensionless
    default: true
    ai_usage: yes
    description: |
      Whether studs are drawn. Selective array allows per-region control
      including stud type override.

  - name: studType
    group: studs
    type: enum
    values: ["solid", "hollow"]
    unit: dimensionless
    default: "solid"
    ai_usage: yes
    description: |
      Type of studs. solid: massive. hollow: with a hole in the center.

  - name: studShift
    group: studs
    type: bool
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether studs are shifted by 1/2 stud in X and Y.
      false: studs sit between pillars.
      true: studs sit directly above pillars.

  - name: studMaxOverhang
    group: studs
    type: float
    unit: mbu
    default: 0.3
    ai_usage: rarely
    description: |
      Maximum allowed stud overhang beyond the outer edge.
      Studs exceeding this are not drawn.

  - name: studPadding
    group: studs
    type: float_or_array
    format: |
      Float: all 4 sides equal.
      2-element array [X, Y]: X for x-(0) and x+(1), Y for y-(2) and y+(3).
      4-element array [x-(0), x+(1), y-(2), y+(3)]: each side individually.
    unit: unitGrid
    default: 0
    ai_usage: yes
    description: |
      Padding from sides 0-3 inward. Shifts the outer wall for the decision
      whether studs are drawn, allowing outer studs to be hidden.

  - name: studClampHeight
    group: studs
    type: float
    unit: mbu
    default: 0.5
    ai_usage: yes
    description: |
      Height of the stud clamp ring at the upper stud edge.
      Creates a near-permanent connection between two bricks.
      Only active when studClampThickness > 0.
    constraints:
      requires:
        - parameter: studClampThickness
          condition: "studClampThickness > 0"

  - name: studClampThickness
    group: studs
    type: float
    unit: mbu
    default: 0.0
    ai_usage: yes
    description: |
      Thickness of the stud clamp ring. At 0 no clamp is active.

  - name: studHoleDiameter
    group: studs
    type: float_or_auto
    unit: mbu
    default: "auto"
    ai_usage: rarely
    description: |
      Diameter of the hole in studs (studType=hollow).
      Automatically calculated.
    constraints:
      requires:
        - parameter: studType
          condition: "studType = 'hollow'"

  - name: studHoleDiameterAdjustment
    group: studs
    type: float
    unit: mm
    default: 0.3
    ai_usage: config_only
    description: |
      Calibration adjustment for studHoleDiameter.

  - name: studHoleClampThickness
    group: studs
    type: float
    unit: mm
    default: 0.1
    ai_usage: rarely
    description: |
      Thickness of the clamp inside the stud hole (studType=hollow).
      A constriction of the inner hole so pins/axles grip in the stud.
    constraints:
      requires:
        - parameter: studType
          condition: "studType = 'hollow'"

  - name: studRounding
    group: studs
    type: float
    unit: mbu
    default: 0.0625
    ai_usage: rarely
    description: |
      Rounding radius of the upper stud edge.

  - name: studDiameter
    group: studs
    type: float
    unit: mbu
    default: 3
    ai_usage: rarely
    description: |
      Diameter of studs. Usually does not need adjustment.

  - name: studDiameterAdjustment
    group: studs
    type: float
    unit: mm
    default: 0.2
    ai_usage: config_only
    description: |
      Calibration adjustment for studDiameter.

  - name: studHeight
    group: studs
    type: float
    unit: mbu
    default: 1
    customizer_range: "[0:0.125:64]"
    ai_usage: rarely
    description: |
      Height of studs. Usually does not need adjustment.

  - name: studHeightAdjustment
    group: studs
    type: float
    unit: mm
    default: 0.0
    ai_usage: config_only
    description: |
      Calibration adjustment for studHeight.

  - name: studSink
    group: studs
    type: float
    unit: mbu
    default: 0.25
    customizer_range: "[0:0.125:64]"
    ai_usage: yes
    description: |
      How deeply the stud is sunk into the block body.
      Ensures the stud is geometrically connected to the body (no floating geometry).
      Also prevents gaps when grille or surfacePattern is active.
      Can be set to 0 when a block has base=false but still renders studs
      (e.g. stud-only decorative layers in composite blocks).

  - name: studCutoutAdjustment
    group: studs
    type: array
    format: "[width, height]"
    unit: mm
    default: [0.2, 0.4]
    ai_usage: config_only
    description: |
      Calibration of stud cutout dimensions (width and height).
      Affects cutouts for studs in baseCutoutType=studs and outer wall
      cutouts in round bricks for grid compatibility. Calibration only.

  # --------------------------------------------------------------------------
  # GROUP: Stud Icon
  # --------------------------------------------------------------------------

  - name: studIcon
    group: stud_icon
    type: string
    unit: dimensionless
    default: "../pattern/bolt-solid-full.svg"
    ai_usage: yes
    description: |
      SVG file engraved into each stud.

  - name: studIconDimensions
    group: stud_icon
    type: array
    format: "[width, height]"
    unit: mm
    default: [169.333, 169.333]
    ai_usage: yes
    description: |
      Dimensions of the stud icon SVG in mm (from the SVG file).
      Default values match all standard icons in the /patterns directory.

  - name: studIconScale
    group: stud_icon
    type: float
    unit: dimensionless
    default: 0.024
    ai_usage: yes
    description: |
      Effective scale factor for the stud icon.

  - name: studIconDepth
    group: stud_icon
    type: float
    unit: mm
    default: -0.2
    ai_usage: yes
    description: |
      Depth of the icon engraving. Negative = engraved into the stud.
      Positive = raised above the stud.

  - name: studIconColor
    group: stud_icon
    type: color_or_inherit
    unit: dimensionless
    default: "inherit"
    ai_usage: yes
    description: |
      Color of the stud icon. "inherit" uses baseColor.
      Only visually relevant when studIconDepth > 0.

  # --------------------------------------------------------------------------
  # GROUP: Tongue / Groove
  # --------------------------------------------------------------------------

  - name: tongue
    group: tongue_groove
    type: bool
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether a tongue (ridge) is drawn. Counterpart to baseCutoutType=groove.
      Tongue and groove are an alternative attachment system for joining two
      bricks, typically to create a solid block from two separate parts.
      The tongue wraps around the outermost ring of studs and is compatible
      with a plate of the same size, but typically used with a groove brick.
      Can be used with or without recess.

  - name: tongueHeight
    group: tongue_groove
    type: float
    unit: mbu
    default: 1.25
    ai_usage: rarely
    description: |
      Height of the tongue.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  - name: tongueGrooveDepth
    group: tongue_groove
    type: float
    unit: mbu
    default: 1.5
    ai_usage: rarely
    description: |
      Depth of the groove. Typically slightly deeper than the tongue height
      to allow for tolerances.
    constraints:
      requires:
        - parameter: baseCutoutType
          condition: "baseCutoutType = 'groove'"

  - name: tongueRoundingRadius
    group: tongue_groove
    type: float_or_auto
    unit: unitGrid
    default: "auto"
    ai_usage: rarely
    description: |
      Rounding radius of the tongue. Typically derived from the block's
      rounding radius. Usually does not need adjustment.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  - name: tongueInnerRoundingRadius
    group: tongue_groove
    type: float_or_auto
    unit: unitGrid
    default: "auto"
    ai_usage: rarely
    description: |
      Rounding radius of the inner side of the tongue. Derived from
      tongueRoundingRadius. Usually does not need adjustment.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  - name: tongueThickness
    group: tongue_groove
    type: float
    unit: mbu
    default: 0.666
    ai_usage: rarely
    description: |
      Thickness of the tongue.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  - name: tongueThicknessAdjustment
    group: tongue_groove
    type: float
    unit: mm
    default: 0
    ai_usage: config_only
    description: |
      Calibration adjustment for tongue thickness. Used to adjust tolerance
      between tongue and groove if connection is too tight.

  - name: tongueOffset
    group: tongue_groove
    type: float
    unit: mbu
    default: 1
    ai_usage: rarely
    description: |
      Distance of the tongue from the side edge.
      Corresponds to the distance of studs from the side edge.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  - name: tongueClampHeight
    group: tongue_groove
    type: float
    unit: mbu
    default: 0.5
    ai_usage: rarely
    description: |
      Height of the tongue clamp lip. Affects both the lip on the tongue
      and the matching recess in the groove for snapping together.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  - name: tongueClampOffset
    group: tongue_groove
    type: float
    unit: mbu
    default: 0.25
    ai_usage: rarely
    description: |
      Distance of the clamp lip from the upper edge of the tongue.
      Also affects the position of the matching recess in the groove.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  - name: tongueClampThickness
    group: tongue_groove
    type: float
    unit: mm
    default: 0.1
    ai_usage: rarely
    description: |
      Thickness of the tongue clamp lip / groove recess.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  # --------------------------------------------------------------------------
  # GROUP: Grille
  # --------------------------------------------------------------------------

  - name: grille
    group: grille
    type: enum
    values: ["none", "x", "y"]
    unit: dimensionless
    default: "none"
    ai_usage: yes
    description: |
      Whether the top plate is rendered as a grille with regular openings.
      "x" or "y" defines the direction of the grille bars.

  - name: grilleInverted
    group: grille
    type: bool
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether the grille starts with an opening instead of a solid bar.
    constraints:
      requires:
        - parameter: grille
          condition: "grille is not 'none'"

  - name: grilleDepth
    group: grille
    type: float
    unit: mbu
    default: 1
    ai_usage: yes
    description: |
      Depth of the grille openings.
    constraints:
      requires:
        - parameter: grille
          condition: "grille is not 'none'"

  - name: grilleCount
    group: grille
    type: int
    unit: dimensionless
    default: 5
    ai_usage: yes
    description: |
      Number of grille bars across the entire surface.
    constraints:
      requires:
        - parameter: grille
          condition: "grille is not 'none'"

  # --------------------------------------------------------------------------
  # GROUP: Recess
  # --------------------------------------------------------------------------

  - name: recess
    group: recess
    type: bool
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether a top-down cavity is created, forming a box with four walls
      and no lid. When active with baseCutoutType=standard, the baseCutout
      depth is reduced to minimum (1 mbu) if recessDepth=auto.

  - name: recessRoundingRadius
    group: recess
    type: float_or_auto
    unit: unitGrid
    default: "auto"
    ai_usage: rarely
    description: |
      Rounding radius of the recess cavity. Derived from the block's
      rounding radius. Usually does not need adjustment.
    constraints:
      requires:
        - parameter: recess
          condition: "recess = true"

  - name: recessDepth
    group: recess
    type: float_or_auto
    unit: unitGrid[1] (plates)
    default: "auto"
    since: "2"
    status: stable
    ai_usage: yes
    description: |
      Depth of the recess cavity, expressed as multiples of one plate (unitGrid[1] = 2 mbu).
      At "auto" depth is maximized.
      When set to an absolute value, the baseCutout (standard) goes up to
      baseCutoutMaxDepth and the remainder is filled with the top plate
      wall between baseCutout and recess.
    constraints:
      requires:
        - parameter: recess
          condition: "recess = true"
    version_history:
      - version: "3.0"
        description: "Unit clarified: recessDepth is in unitGrid[1] (plates), not raw mbu."

  - name: recessWallThickness
    group: recess
    type: float_or_array
    format: |
      Float: all 4 sides equal.
      2-element array [X, Y]: X for x-(0) and x+(1), Y for y-(2) and y+(3).
      4-element array [x-(0), x+(1), y-(2), y+(3)]: each side individually.
    unit: unitGrid
    default: 0.333
    ai_usage: yes
    description: |
      Wall thickness of the recess cavity (box wall thickness).
    constraints:
      requires:
        - parameter: recess
          condition: "recess = true"

  - name: recessStuds
    group: recess
    type: bool
    unit: dimensionless
    default: true
    ai_usage: yes
    description: |
      Whether studs are drawn on the recess floor. Studs are at the same
      X/Y position as without recess. Only drawn if a 1x1 brick fits —
      studs too close to the recess wall are hidden.
    constraints:
      requires:
        - parameter: recess
          condition: "recess = true"

  - name: recessStudPadding
    group: recess
    type: float_or_array
    format: |
      Float: all 4 sides equal.
      2-element array [X, Y]: X for x-(0) and x+(1), Y for y-(2) and y+(3).
      4-element array [x-(0), x+(1), y-(2), y+(3)]: each side individually.
    unit: unitGrid
    default: 0.2
    ai_usage: yes
    description: |
      Padding from the recess wall inward. Determines whether outer studs
      in the recess are hidden. Studs whose center is closer to the recess
      wall than this padding value are not drawn.
    constraints:
      requires:
        - parameter: recessStuds
          condition: "recessStuds = true"

  - name: recessStudType
    group: recess
    type: enum
    values: ["solid", "hollow"]
    unit: dimensionless
    default: "solid"
    ai_usage: yes
    description: |
      Type of studs on the recess floor.
      solid: massive studs. hollow: studs with a hole in the center.
    constraints:
      requires:
        - parameter: recessStuds
          condition: "recessStuds = true"

  - name: recessStudShift
    group: recess
    type: bool
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether recess floor studs are shifted by 1/2 stud in X and Y.
      false: studs sit at standard positions.
      true: studs are shifted by half a stud in both directions.
    constraints:
      requires:
        - parameter: recessStuds
          condition: "recessStuds = true"

  - name: recessWallGaps
    group: recess
    type: array
    format: |
      Short form — single side, full opening:
        Integer:      recessWallGaps = 0  (side 0 fully open)
        String:       recessWallGaps = "x-"  (same, using string side)
        1-element:    recessWallGaps = [0]  or  ["x-"]
        Multi-side:   recessWallGaps = ["x+", "y-"]
      Full form — with left/right offsets (internal format):
        [[side, offset_left, offset_right], ...]
        offsets are in unitGrid; 0 = full opening on that side.
      Short forms are internally expanded to the full format.
    unit: "side: side index (0-3) or string ("x-" etc.), offsets: unitGrid"
    default: []
    since: "2"
    status: stable
    ai_usage: yes
    description: |
      Openings in recess walls. Each entry specifies a side and optional
      left/right offsets to create partial or full wall openings.
      Also creates matching openings in tongue and groove.
    constraints:
      requires:
        - parameter: recess
          condition: "recess = true"
      affects:
        - tongue
        - baseCutoutType (groove)
    example: |
      Short:  recessWallGaps = "x+"          — side x+ fully open
      Short:  recessWallGaps = ["x+", "y-"]  — two sides fully open
      Full:   [["x-", 1, 2], ["y+", 0, 1]]  — partial openings with offsets
    version_history:
      - version: "2"
        description: "Full format only: [[side, offset_left, offset_right], ...]"
      - version: "3.0"
        description: |
          Short forms added: integer, string, or flat array of sides for fully open walls.
          Sides can now be specified as strings ("x-", "x+", "y-", "y+").
          Short forms are expanded to the internal full format automatically.

  # --------------------------------------------------------------------------
  # GROUP: Text
  # --------------------------------------------------------------------------

  - name: text
    group: text
    type: string
    unit: dimensionless
    default: ""
    ai_usage: yes
    description: |
      Text to draw on the brick. If not empty, rendered on the side
      specified by textSide.

  - name: textSide
    group: text
    type: int
    values: [0, 1, 2, 3, 4, 5]
    unit: dimensionless
    default: 0
    ai_usage: yes
    description: |
      Side of the brick on which text is displayed (0-5).
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  - name: textDepth
    group: text
    type: float
    unit: mbu
    default: -0.25
    ai_usage: yes
    description: |
      Depth/height of the text. Negative = engraved. Positive = raised.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  - name: textFont
    group: text
    type: string
    unit: dimensionless
    default: "Liberation Sans"
    ai_usage: yes
    description: |
      Font family for the text.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  - name: textSize
    group: text
    type: float
    unit: pt
    default: 4
    ai_usage: yes
    description: |
      Font size of the text.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  - name: textSpacing
    group: text
    type: float
    unit: pt
    default: 1
    ai_usage: yes
    description: |
      Letter spacing of the text.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  - name: textVerticalAlign
    group: text
    type: enum
    values: ["left", "right", "center"]
    unit: dimensionless
    default: "center"
    ai_usage: yes
    description: |
      Vertical alignment of the text on the brick surface.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  - name: textHorizontalAlign
    group: text
    type: enum
    values: ["left", "right", "center"]
    unit: dimensionless
    default: "center"
    ai_usage: yes
    description: |
      Horizontal alignment of the text on the brick surface.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  - name: textOffset
    group: text
    type: array
    format: "[x, y]"
    unit: unitGrid
    default: [0, 0]
    ai_usage: yes
    description: |
      Offset of the text from its normal position.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  - name: textColor
    group: text
    type: color
    format: "Hex RGB '#ff00ff', Hex RGBA '#ff00ffaa', or RGBA float array [0..1, 0..1, 0..1, 0..1]"
    unit: dimensionless
    default: "#2c3e50"
    ai_usage: yes
    description: |
      Color of the text. Independent from baseColor.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  # --------------------------------------------------------------------------
  # GROUP: Surface Pattern
  # --------------------------------------------------------------------------

  - name: surfacePattern
    group: surface_pattern
    type: string
    unit: dimensionless
    default: "none"
    ai_usage: yes
    description: |
      SVG file for a pattern on the brick surface. Applied to the brick
      body surface as a repeating or single pattern.

  - name: surfacePatternDimensions
    group: surface_pattern
    type: array
    format: "[width, height]"
    unit: mm
    default: [451.556, 451.556]
    ai_usage: yes
    description: |
      Dimensions of the surface pattern SVG in mm (from the SVG file).
    constraints:
      requires:
        - parameter: surfacePattern
          condition: "surfacePattern is not 'none'"

  - name: surfacePatternOffset
    group: surface_pattern
    type: array
    format: "[x, y]"
    unit: unitGrid
    default: [0, 0]
    ai_usage: yes
    description: |
      Offset of the surface pattern.
    constraints:
      requires:
        - parameter: surfacePattern
          condition: "surfacePattern is not 'none'"

  - name: surfacePatternScale
    group: surface_pattern
    type: float
    unit: dimensionless
    default: 0.25
    ai_usage: yes
    description: |
      Scale factor for the surface pattern.
    constraints:
      requires:
        - parameter: surfacePattern
          condition: "surfacePattern is not 'none'"

  - name: surfacePatternDepth
    group: surface_pattern
    type: float
    unit: mm
    default: -0.2
    ai_usage: yes
    description: |
      Depth of the surface pattern. Negative = engraved. Positive = raised.
    constraints:
      requires:
        - parameter: surfacePattern
          condition: "surfacePattern is not 'none'"

  - name: surfacePatternColor
    group: surface_pattern
    type: color_or_inherit
    unit: dimensionless
    default: "inherit"
    ai_usage: yes
    description: |
      Color of the surface pattern. "inherit" uses baseColor.
      Only visually relevant when surfacePatternDepth > 0.
    constraints:
      requires:
        - parameter: surfacePattern
          condition: "surfacePattern is not 'none'"

  # --------------------------------------------------------------------------
  # GROUP: SVG
  # --------------------------------------------------------------------------

  - name: svg
    group: svg
    type: string
    unit: dimensionless
    default: ""
    ai_usage: yes
    description: |
      SVG file to draw on a brick side. Placed on the side specified
      by svgSide.

  - name: svgSide
    group: svg
    type: int
    values: [0, 1, 2, 3, 4, 5]
    unit: dimensionless
    default: 5
    ai_usage: yes
    description: |
      Side on which the SVG is drawn (0-5).
    constraints:
      requires:
        - parameter: svg
          condition: "svg is not empty"

  - name: svgDepth
    group: svg
    type: float
    unit: mbu
    default: 0.4
    ai_usage: yes
    description: |
      Depth/height of the SVG. Negative = engraved. Positive = raised.
    constraints:
      requires:
        - parameter: svg
          condition: "svg is not empty"

  - name: svgDimensions
    group: svg
    type: array
    format: "[width, height]"
    unit: mm
    default: [100, 100]
    ai_usage: yes
    description: |
      Dimensions of the SVG in mm (from the SVG file).
    constraints:
      requires:
        - parameter: svg
          condition: "svg is not empty"

  - name: svgScale
    group: svg
    type: float
    unit: dimensionless
    default: 1.0
    ai_usage: yes
    description: |
      Scale factor for the SVG.
    constraints:
      requires:
        - parameter: svg
          condition: "svg is not empty"

  - name: svgOffset
    group: svg
    type: array
    format: "[x, y]"
    unit: unitGrid
    default: [0, 0]
    ai_usage: yes
    description: |
      Offset of the SVG from its default position.
    constraints:
      requires:
        - parameter: svg
          condition: "svg is not empty"

  - name: svgColor
    group: svg
    type: color
    format: "Hex RGB '#ff00ff', Hex RGBA '#ff00ffaa', or RGBA float array [0..1, 0..1, 0..1, 0..1]"
    unit: dimensionless
    default: "#2c3e50"
    ai_usage: yes
    description: |
      Color of the SVG.
    constraints:
      requires:
        - parameter: svg
          condition: "svg is not empty"

  # --------------------------------------------------------------------------
  # GROUP: Connectors
  # --------------------------------------------------------------------------

  - name: connectors
    group: connectors
    type: bool_or_array
    format: |
      false: no connectors.
      Array of 2-element arrays: [[side, arrangement], ...]
      - side: side number (0-3)
      - arrangement:
        0: protruding triangles, tip at wall, wide side outward, full brick height
        1: recess, wide side inward, tip outward — counterpart to 0 for
           connecting two bricks side by side (0°)
        2: recess, wide side up, tip down — for 90° downward connection
        3: recess, wide side down, tip up — for 90° upward connection
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Side connection system using triangles. Alternative to tongue/groove
      which connects vertically. Connectors enable side-by-side and
      angled (90°) connections.

  - name: connectorPadding
    group: connectors
    type: array
    format: "[start, end]"
    unit: "number of triangles"
    default: [0, 0]
    ai_usage: yes
    description: |
      How many triangles to skip at the start and end of a side.
      Important when connecting bricks of different sizes.
    constraints:
      requires:
        - parameter: connectors
          condition: "connectors is not false"

  - name: connectorHeight
    group: connectors
    type: float_or_auto
    unit: mbu
    default: "auto"
    ai_usage: yes
    description: |
      Height of the connector triangles. At "auto" equals the brick height.
    constraints:
      requires:
        - parameter: connectors
          condition: "connectors is not false"

  - name: connectorDepth
    group: connectors
    type: float
    unit: mbu
    default: 0.75
    ai_usage: yes
    description: |
      How far the connector triangles protrude.
    constraints:
      requires:
        - parameter: connectors
          condition: "connectors is not false"

  - name: connectorWidth
    group: connectors
    type: float
    unit: mbu
    default: 2.5
    ai_usage: yes
    description: |
      Width of the connector triangles.
    constraints:
      requires:
        - parameter: connectors
          condition: "connectors is not false"

  - name: connectorDepthTolerance
    group: connectors
    type: float
    unit: mm
    default: 0.2
    ai_usage: rarely
    description: |
      Tolerance of the recess depth relative to the triangle depth.
    constraints:
      requires:
        - parameter: connectors
          condition: "connectors is not false"

  - name: connectorSideTolerance
    group: connectors
    type: float
    unit: mm
    default: 0.1
    ai_usage: rarely
    description: |
      Tolerance of the recess width relative to the triangle width.
    constraints:
      requires:
        - parameter: connectors
          condition: "connectors is not false"

  # --------------------------------------------------------------------------
  # GROUP: Screw Holes X / Y
  # --------------------------------------------------------------------------

  - name: screwHolesX
    group: screw_holes
    type: array
    format: "[[x, z], ...] or [[x, z, side], ...]"
    unit: unitGrid
    default: []
    ai_usage: yes
    description: |
      Mounting holes along the X-axis.
      - x, z: position in unitGrid
      - side: 0 = x- side, 1 = x+ side, undef = both sides

  - name: screwHoleXSize
    group: screw_holes
    type: float
    unit: mm
    default: 2.1
    ai_usage: yes
    description: |
      Diameter of X-axis mounting holes.
    constraints:
      requires:
        - parameter: screwHolesX
          condition: "screwHolesX is not empty"

  - name: screwHoleXDepth
    group: screw_holes
    type: float
    unit: mm
    default: 4
    ai_usage: yes
    description: |
      Depth of X-axis mounting holes.
    constraints:
      requires:
        - parameter: screwHolesX
          condition: "screwHolesX is not empty"

  - name: screwHolesY
    group: screw_holes
    type: array
    format: "[[y, z], ...] or [[y, z, side], ...]"
    unit: unitGrid
    default: []
    ai_usage: yes
    description: |
      Mounting holes along the Y-axis.
      - y, z: position in unitGrid
      - side: 0 = y- side, 1 = y+ side, undef = both sides

  - name: screwHoleYSize
    group: screw_holes
    type: float
    unit: mm
    default: 2.1
    ai_usage: yes
    description: |
      Diameter of Y-axis mounting holes.
    constraints:
      requires:
        - parameter: screwHolesY
          condition: "screwHolesY is not empty"

  - name: screwHoleYDepth
    group: screw_holes
    type: float
    unit: mm
    default: 4
    ai_usage: yes
    description: |
      Depth of Y-axis mounting holes.
    constraints:
      requires:
        - parameter: screwHolesY
          condition: "screwHolesY is not empty"

  # --------------------------------------------------------------------------
  # GROUP: Screw Holes Z
  # --------------------------------------------------------------------------

  - name: screwHolesZ
    group: screw_holes
    type: array
    format: "[[x, y], ...]"
    unit: unitGrid
    default: []
    ai_usage: yes
    description: |
      Mounting holes in Z-direction on the top plate (baseCutoutType=standard)
      or solid brick (baseCutoutType=none). Positions correspond to where
      studs are or would be.

  - name: screwHoleZSize
    group: screw_holes
    type: float
    unit: mm
    default: 2.3
    ai_usage: yes
    description: |
      Diameter of Z-axis mounting holes.
    constraints:
      requires:
        - parameter: screwHolesZ
          condition: "screwHolesZ is not empty"

  - name: screwHoleZHelperThickness
    group: screw_holes
    type: float
    unit: mm
    default: 0.8
    ai_usage: rarely
    description: |
      Thickness of helpers for Z-axis mounting holes on the underside.
      Required for baseCutoutType=standard to avoid needing print support.
    constraints:
      requires:
        - parameter: screwHolesZ
          condition: "screwHolesZ is not empty"

  - name: screwHoleZHelperOffset
    group: screw_holes
    type: float
    unit: mm
    default: 0.2
    ai_usage: rarely
    description: |
      Offset between the two helper layers for Z-axis mounting holes.
    constraints:
      requires:
        - parameter: screwHolesZ
          condition: "screwHolesZ is not empty"

  - name: screwHoleZHelperHeight
    group: screw_holes
    type: float
    unit: mm
    default: 0.2
    ai_usage: rarely
    description: |
      Height of the helper layers for Z-axis mounting holes.
    constraints:
      requires:
        - parameter: screwHolesZ
          condition: "screwHolesZ is not empty"

  # --------------------------------------------------------------------------
  # GROUP: PCB
  # --------------------------------------------------------------------------

  - name: pcb
    group: pcb
    type: bool
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether the brick includes PCB mounting features.

  - name: pcbMountingType
    group: pcb
    type: enum
    values: ["clips", "screws"]
    unit: dimensionless
    default: "clips"
    ai_usage: yes
    description: |
      Type of PCB mounting.
      clips: frame for clipping in the PCB.
      screws: screw sockets for screw mounting.
    constraints:
      requires:
        - parameter: pcb
          condition: "pcb = true"

  - name: pcbDimensions
    group: pcb
    type: array
    format: "[x, y, z]"
    unit: mm
    default: [20, 30, 3]
    ai_usage: yes
    description: |
      Dimensions of the PCB in mm. Refers to the board size,
      especially relevant for pcbMountingType=clips.
    constraints:
      requires:
        - parameter: pcb
          condition: "pcb = true"

  - name: pcbOffset
    group: pcb
    type: array
    format: "[x, y]"
    unit: unitGrid
    default: [0, 0]
    ai_usage: yes
    description: |
      Offset of the PCB from the center of the brick.
    constraints:
      requires:
        - parameter: pcb
          condition: "pcb = true"

  - name: pcbScrewSocketSize
    group: pcb
    type: float
    unit: mm
    default: 5
    ai_usage: yes
    description: |
      Diameter of screw sockets.
    constraints:
      requires:
        - parameter: pcbMountingType
          condition: "pcbMountingType = 'screws'"

  - name: pcbScrewSocketHoleSize
    group: pcb
    type: float
    unit: mm
    default: 2.2
    ai_usage: yes
    description: |
      Diameter of the screw hole inside the socket.
    constraints:
      requires:
        - parameter: pcbMountingType
          condition: "pcbMountingType = 'screws'"

  - name: pcbScrewSocketHeight
    group: pcb
    type: float
    unit: mm
    default: 3
    ai_usage: yes
    description: |
      Height of the screw sockets.
    constraints:
      requires:
        - parameter: pcbMountingType
          condition: "pcbMountingType = 'screws'"

  - name: pcbScrewSockets
    group: pcb
    type: array
    format: "[[x, y], ...]"
    unit: mm
    default: []
    ai_usage: yes
    description: |
      Positions of screw sockets. Each entry gives the distance of the
      socket center from the brick center in mm.
    constraints:
      requires:
        - parameter: pcbMountingType
          condition: "pcbMountingType = 'screws'"

  # --------------------------------------------------------------------------
  # GROUP: Quality / Rendering
  # --------------------------------------------------------------------------

  - name: qualitySegBase
    group: quality
    type: float
    unit: mm
    default: 1.2
    ai_usage: rarely
    description: |
      Base mm per segment for quality calculation.

  - name: qualityFactor
    group: quality
    type: array
    format: "[functional, visual, other, draft]"
    unit: dimensionless
    default: [0.6, 1.0, 1.6, 2.5]
    ai_usage: rarely
    description: |
      Quality factors for 4 rounding groups: functional, visual, other, draft.
      Basis for calculating rounding resolution from radius and group.

  - name: qualityResolutionMin
    group: quality
    type: array
    format: "[functional, visual, other, draft]"
    unit: dimensionless
    default: [24, 18, 12, 8]
    ai_usage: rarely
    description: |
      Minimum resolution ($fn) per quality group.

  - name: qualityResolutionMax
    group: quality
    type: int
    unit: dimensionless
    default: 220
    ai_usage: rarely
    description: |
      Global maximum resolution ($fn).

  - name: qualityResolutionMultiplier
    group: quality
    type: float
    unit: dimensionless
    default: 0.25
    ai_usage: rarely
    description: |
      Global quality factor. Lower = higher quality.

  - name: previewQuality
    group: quality
    type: float
    unit: dimensionless
    default: 0.5
    ai_usage: rarely
    description: |
      Factor that reduces quality in OpenSCAD preview mode.

  - name: previewRender
    group: quality
    type: bool
    unit: dimensionless
    default: false
    ai_usage: rarely
    description: |
      Whether the block is rendered as mesh in OpenSCAD preview mode
      instead of CSG.

  - name: previewRenderConvexity
    group: quality
    type: int
    unit: dimensionless
    default: 15
    ai_usage: rarely
    description: |
      Convexity parameter passed to OpenSCAD render() function.

# ============================================================================
# COMPOSITE BLOCK PARAMETERS
# ============================================================================
# These parameters are native parameters recognized by the system, but are
# intentionally IGNORED by mb_block(). They are only meaningful in composite
# block modules, which must implement their behavior explicitly.
# ============================================================================

composite_block_parameters:

  - name: assembly
    group: composite
    type: string_or_array
    format: |
      String format:
        "unassembled" | "assembled" | "merged"

      Array format (required when this block is itself a child of another
      composite block):
        [mode, [sX, sY, sZ], direction]
        - mode: "unassembled" | "assembled" | "merged"
        - [sX, sY, sZ]: direction-resolved size of the outer composite block
        - direction: aggregated direction through the full block tree (int or string)
    unit: dimensionless
    default: "assembled"
    since: "3.0"
    status: stable
    ai_usage: yes
    description: |
      Controls the visualization mode of a composite block.
      Must be actively implemented by composite block modules.
      mb_block() ignores this parameter.

      unassembled: parts are laid out individually for printing,
        spaced 4mm apart along X-axis.
      assembled: parts shown in connected position including internal geometry.
      merged: parts fused into a single body; tongue/groove and internal
        voids are suppressed.

      Always resolve via mb_assembly(config, settings, size, direction).
      Always check mode via assembly[0] after resolution.

      The array format is required when this composite block is itself
      used as a child inside another composite block. The size and direction
      in the array are used to correctly position unassembled parts.
      mb_assembly() handles this propagation automatically.

  - name: assemblyParts
    group: composite
    type: string_or_array
    format: |
      String: "all" — all parts are rendered.
      String: part ID — only that specific part is rendered.
      Array of strings: ["bottom", "top"] — only listed parts are rendered.
      "all" is a reserved value that always renders every part.
    unit: dimensionless
    default: "all"
    since: "3.0"
    status: stable
    ai_usage: yes
    description: |
      Controls which named parts of a composite block are rendered.
      Used together with the render parameter and mb_assembly_parts_render().
      mb_block() ignores this parameter; it must be implemented in composite modules.

      Part IDs are freely defined by the composite block module.
      "all" always renders all parts regardless of IDs.

      Usage:
        assemblyParts = mb_param_assemblyParts(config, settings);
        // Then per part:
        ["render", mb_assembly_parts_render(assemblyParts, "bottom")]
        ["render", mb_assembly_parts_render(assemblyParts, "top")]

      mb_assembly_parts_render(assemblyParts, part, solo=false):
        Returns true if the part should be rendered.
        solo=true: returns true only if assemblyParts contains ONLY this part.

  - name: namedSideAdjustments
    group: composite
    type: array
    format: |
      Array of [name, adjustment_mm] pairs:
        [["start", 0.01], ["end", 0.01]]
      Names are freely chosen by the composite block module.
    unit: mm
    default: []
    ai_usage: yes
    description: |
      Allows an outer composite block to extend specific named sides of a child
      composite block, creating a controlled minimal overlap (typically 0.01mm)
      between adjacent parts. This is necessary when baseSideAdjustment is
      negative — without overlap, adjacent parts would have a visible gap or a
      zero-thickness shared wall at their contact faces.

      WHY named sides instead of a 4-element baseSideAdjustment array:
      A composite block can have more than 4 logical sides. A 4-element array
      is therefore insufficient to address individual contact faces. Named sides
      allow the outer block to target specific internal contact faces by name,
      regardless of how many sides the child has internally.

      USAGE — inside the child composite block module:
      The child reads both parameters and calls mb_named_side_adjustments() for
      XY sides, or mb_named_height_adjustments() for Z-axis height adjustments.
      These are two separate functions in V3:

        baseSideAdjustment = mb_param_baseSideAdjustment(config, settings);
        baseHeightAdjustment = mb_param_baseHeightAdjustment(config, settings);
        namedSideAdjustments = mb_param_namedSideAdjustments(config, settings);

        // XY side adjustments:
        panelSideAdjustment = mb_named_side_adjustments(
            baseSideAdjustment,
            namedSideAdjustments,
            [["y-", "start"], ["y+", "end"]]
        );

        // Z height adjustments:
        panelHeightAdjustment = mb_named_height_adjustments(
            baseHeightAdjustment,
            namedSideAdjustments,
            [["z+", "height"]]
        );

      mb_named_side_adjustments() third argument maps side strings or indices
      (in west orientation) to named side keys. Preferred format is strings
      ("x-", "x+", "y-", "y+"). Integer indices (0-3) also remain valid.

      mb_named_side_adjustments() useFirst (default true):
        useFirst = true  (default): baseSideAdjustment[0] is used for all sides
          as the base value. Only named sides are overridden.
        useFirst = false: the full 4-element baseSideAdjustment array is used.
          Rarely needed.

      mb_named_height_adjustments() has no useFirst parameter.
      It always uses the full baseHeightAdjustment [z-, z+] array as the base.

      USAGE — in the outer composite block:
      The outer block passes the adjustments to each child composite block:
        ["namedSideAdjustments", [["start", 0.01], ["end", 0.01]]]

      Composite blocks must NOT receive a baseSideAdjustment with differing
      values to control contact faces — use namedSideAdjustments instead.

      mb_block() ignores this parameter.



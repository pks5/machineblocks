    unit: mbu
    default: 0.5
    ai_usage: rarely
    description: |
      Width of a single grid strut.
    constraints:
      requires:
        - parameter: stabilizerGrid
          condition: "stabilizerGrid = true"

  - name: stabilizerExpansion
    group: print_helpers
    type: int
    unit: dimensionless
    default: 2
    ai_usage: rarely
    description: |

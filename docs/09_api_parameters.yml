          condition: "svg is not empty"

  # --------------------------------------------------------------------------
  # GROUP: Connectors
  # --------------------------------------------------------------------------

  - name: connectors
    group: connectors
    type: bool_or_array
    format: |
      false: no connectors.
      Array of connector definition arrays:
        [ [face, direction, gender, align?, paddingStart?, paddingEnd?], ... ]

      Inner array fields:
        0 face (required): brick side where connectors are placed.
             "x-" | "x+" | "y-" | "y+" | "z-" | "z+" (or int 0-5)
        1 direction (required): orientation of the connectors.
             "z" for faces x- to y+ (runs along height)
             "x" or "y" for z- and z+ faces
        2 gender (required): shape type.
             "male" | 1 | true  — protruding triangles
             "female" | 0 | false — recesses (counterpart to male, 0°)
             "female_bottom" (2) — recess on underside, for 90° downward connection
             "female_top" (3)    — recess on topside, for 90° upward connection
        3 align (optional, default "start"): alignment along the face.
             Only relevant when connectorLength != "auto".
             "start" — aligned toward x-/y-/z- end of the face
             "center" — centered on the face
             "end" — aligned toward x+/y+/z+ end of the face
             For faces x-/x+/y-/y+: align is along z-axis.
             For faces z-/z+: align is along x (direction="x") or y (direction="y").
        4 paddingStart (optional, default 0): number of connectors to skip at start.
        5 paddingEnd (optional, default 0): number of connectors to skip at end.

      connectorLength = "auto": length equals available space.
        For faces x- to y+: available space = brick height.
        For z- and z+: available space = brick width (x) or depth (y) per direction.

    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Side connection system using triangular wedges. Alternative to tongue/groove.
      Enables side-by-side (0°) and angled (90°) connections.
      Padding skips connectors at start/end — important when connecting
      bricks of different sizes.
    example: |
      [ ["y+", "z", "female", "start", 1, 1],
        ["z+", "x", "male", "end"],
        ["z-", "y", "male"] ]
    version_history:
      - version: "2"
        description: |
          Format was [[side, arrangement], ...] with arrangement 0-3.
          Padding was a separate connectorPadding parameter [start, end].
      - version: "3.0"
        description: |
          New format: [face, direction, gender, align?, paddingStart?, paddingEnd?].
          Padding is now per-connector inside the array.
          connectorPadding parameter removed.
          gender encoding: male=1=true, female=0=false, female_bottom=2, female_top=3.

  # connectorPadding removed in V3 — padding is now per-connector inside the connectors array.

  - name: connectorLength
    group: connectors
    type: float_or_auto
    unit: mbu
    default: "auto"
    ai_usage: yes
    description: |
      Length of the connector run on the face. At "auto" equals the
      available space (brick height for x/y faces, width/depth for z faces).
    constraints:
      requires:
        - parameter: connectors
          condition: "connectors is not false"
    version_history:
      - version: "2"
        description: "Named connectorHeight in V2."
      - version: "3.0"
        description: "Renamed to connectorLength."

  - name: connectorDepth
    group: connectors
    type: float
    unit: mbu
    default: 0.75
    ai_usage: yes
    description: |
      How far the connector triangles protrude.
    constraints:
      requires:
        - parameter: connectors
          condition: "connectors is not false"

  - name: connectorWidth
    group: connectors
    type: float
    unit: mbu
    default: 2.5
    ai_usage: yes
    description: |
      Width of the connector triangles.
    constraints:
      requires:
        - parameter: connectors
          condition: "connectors is not false"

  - name: connectorLengthClearance
    group: connectors
    type: float
    unit: mm
    default: 0.2
    ai_usage: rarely
    description: |
      Clearance of the recess depth relative to the triangle depth.
      Ensures male and female connectors fit together.
    constraints:
      requires:
        - parameter: connectors
          condition: "connectors is not false"
    version_history:
      - version: "2"
        description: "Named connectorDepthTolerance in V2."
      - version: "3.0"
        description: "Renamed to connectorLengthClearance."

  - name: connectorSideClearance
    group: connectors
    type: float
    unit: mm
    default: 0.1
    ai_usage: rarely
    description: |
      Clearance of the recess width relative to the triangle width.
      Ensures male and female connectors fit together.
    constraints:
      requires:
        - parameter: connectors
          condition: "connectors is not false"
    version_history:
      - version: "2"
        description: "Named connectorSideTolerance in V2."
      - version: "3.0"
        description: "Renamed to connectorSideClearance."

  # --------------------------------------------------------------------------
  # GROUP: Screw Holes
  # --------------------------------------------------------------------------

  - name: screwHoles
    group: screw_holes
    type: array
    format: |
      Array of hole definition arrays:
        [ [face, position, diameter?, depth?, insetThickness?, insetDepth?], ... ]

      Inner array fields:
        0 face (required): face the hole is drilled from.
             "x-" | "x+" | "y-" | "y+" | "z-" | "z+" (or int 0-5)
        1 position (required): grid position of the hole center.
             For face z: [x, y] grid position
             For face y: [x, z] grid position
             For face x: [y, z] grid position
        2 diameter (optional): hole diameter in mm. Defaults to screwHoleDiameter.
        3 depth (optional): hole depth in mm. Defaults to screwHoleDepth.
        4 insetThickness (optional): inset ring thickness in mm. Defaults to screwHoleInsetThickness.
        5 insetDepth (optional): inset ring depth in mm. Defaults to screwHoleInsetDepth.

    unit: "position in unitGrid, sizes in mm"
    default: []
    since: "3.0"
    status: stable
    ai_usage: yes
    description: |
      Mounting screw holes on any face of the brick. Each entry defines one hole
      with a face, a grid position, and optional per-hole size overrides.
      Global defaults for diameter, depth, and inset are set via the
      screwHoleDiameter, screwHoleDepth, screwHoleInsetThickness, screwHoleInsetDepth
      parameters.
    example: |
      [ ["z+", [0,0]],
        ["y+", [2,2]],
        ["y+", [2,2], 1, 1.2, 0.5, 0.6] ]
    version_history:
      - version: "2"
        description: |
          Three separate parameters: screwHolesX ([[x,z],...]), screwHolesY ([[y,z],...]),
          screwHolesZ ([[x,y],...]). Size/depth specified per axis via screwHoleXSize,
          screwHoleXDepth, screwHoleYSize, screwHoleYDepth, screwHoleZSize.
      - version: "3.0"
        description: |
          Consolidated into screwHoles with unified face+position format.
          Per-hole overrides possible. Global defaults via screwHole* parameters.

  - name: screwHoleDiameter
    group: screw_holes
    type: float
    unit: mm
    default: 2.1
    ai_usage: yes
    description: |
      Default diameter of screw holes. Can be overridden per hole in screwHoles.
    version_history:
      - version: "2"
        description: "screwHoleXSize (2.1mm), screwHoleYSize (2.1mm), screwHoleZSize (2.3mm) were separate."
      - version: "3.0"
        description: "Unified default via screwHoleDiameter. Per-hole override possible."

  - name: screwHoleDepth
    group: screw_holes
    type: float
    unit: mm
    default: 4
    ai_usage: yes
    description: |
      Default depth of screw holes. Can be overridden per hole in screwHoles.
    version_history:
      - version: "2"
        description: "screwHoleXDepth and screwHoleYDepth were separate (no depth for Z holes)."
      - version: "3.0"
        description: "Unified default via screwHoleDepth."

  - name: screwHoleInsetThickness
    group: screw_holes
    type: float
    unit: mm
    default: 0
    since: "3.0"
    status: stable
    ai_usage: yes
    description: |
      Default inset ring thickness around screw holes. 0 = no inset.
      Can be overridden per hole in screwHoles.

  - name: screwHoleInsetDepth
    group: screw_holes
    type: float
    unit: mm
    default: 0
    since: "3.0"
    status: stable
    ai_usage: yes
    description: |
      Default inset ring depth for screw holes. 0 = no inset.
      Can be overridden per hole in screwHoles.

  - name: screwHoleZHelperThickness
    group: screw_holes
    type: float
    unit: mm
    default: 0.8
    ai_usage: rarely
    description: |
      Thickness of print helpers for Z-face screw holes on the underside.
      Required for baseCutoutType=standard to avoid needing print support.

  - name: screwHoleZHelperLayerOffset
    group: screw_holes
    type: float_or_auto
    unit: mm
    default: "auto"
    ai_usage: rarely
    description: |
      Offset between the two helper layers for Z-face screw holes.
      "auto" uses printerLayerHeight.
    version_history:
      - version: "2"
        description: "Named screwHoleZHelperOffset in V2."
      - version: "3.0"
        description: "Renamed to screwHoleZHelperLayerOffset. Supports 'auto' (uses printerLayerHeight)."

  - name: screwHoleZHelperHeight
    group: screw_holes
    type: float
    unit: mm
    default: 0.2
    ai_usage: rarely
    description: |
      Height of the helper layers for Z-face screw holes.

  # --------------------------------------------------------------------------
  # GROUP: PCB
  # --------------------------------------------------------------------------

  - name: pcb
    group: pcb
    type: enum_or_false
    values: [false, "none", "clips", "sockets"]
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      PCB mounting mode. Combines the former pcb (bool) and pcbMountingType into one.
      false or "none": no PCB mounting features.
      "clips": frame for clipping in the PCB.
      "sockets": screw sockets for socket/screw mounting.
    version_history:
      - version: "2"
        description: |
          Two separate parameters: pcb (bool, whether PCB mounting is active) and
          pcbMountingType ("clips" | "screws" for mounting type).
      - version: "3.0"
        description: |
          Merged into pcb. false/"none" = off, "clips" = clip mounting,
          "sockets" = socket mounting (formerly "screws"). pcbMountingType removed.

  # pcbMountingType removed in V3 — merged into pcb parameter.

  - name: pcbDimensions
    group: pcb
    type: array
    format: "[x, y, z]"
    unit: mm
    default: [20, 30, 3]
    ai_usage: yes
    description: |
      Dimensions of the PCB in mm. Refers to the board size,
      especially relevant for pcb="clips".
    constraints:
      requires:
        - parameter: pcb
          condition: "pcb is not false and pcb is not 'none'"

  - name: pcbOffset
    group: pcb
    type: array
    format: "[x, y]"
    unit: unitGrid
    default: [0, 0]
    ai_usage: yes
    description: |
      Offset of the PCB from the center of the brick.
    constraints:
      requires:

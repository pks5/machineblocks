# ============================================================================
# CHANGELOG — PARAMETERS CHANGED IN V3
# ============================================================================
# Parameters changed in format or behavior from V2 to V3.
# Full details in the parameter's version_history field.
# ============================================================================

changed_in_v3:

  - name: baseAdjustment
    changed_in: "3.0"
    summary: |
      Renamed from baseSideAdjustment. Format changed from float/2-element/
      4-element array to pseudo-map [[side, value]] format. Now supports all
      6 sides (including z-) and namespace-prefixed keys for composite patterns.
      z- now has a special downward-shift behaviour (not a plain height reduction).
      Default changed from -0.1 to [] (empty).

  - name: recessDepth
    changed_in: "3.0"
    summary: "Unit clarified: unitGrid[1] (plates), not raw mbu."

  - name: recessWallGaps
    changed_in: "3.0"
    summary: "Short form input added; sides can now be specified as strings."

  - name: align
    changed_in: "3.0"
    summary: "mb_param_align() now always resolves to a 3-element array."

  - name: alignChildren
    changed_in: "3.0"
    summary: "mb_param_alignChildren() now always resolves to a 3-element array."

  - name: size
    changed_in: "3.0"
    summary: "Values must be integers. Fractional values are no longer permitted."

  - name: crop
    changed_in: "3.0"
    summary: |
      Now a hard cut in all cases, with no regard for grid compatibility,
      walls, or structural features. Use sizeMod for semantic size changes.

  - name: slope
    changed_in: "3.0"
    summary: "Can now be combined with bevel. The conflicts_with constraint has been removed."

  - name: bevel
    changed_in: "3.0"
    summary: "Can now be combined with slope."

  - name: tongueClampOffset
    changed_in: "3.0"
    summary: |
      Measurement changed from upper-edge-to-upper-edge to lower-edge-to-lower-edge.
      This avoids needing to calculate groove depth when positioning the clamp.

  - name: sizeAdjustment
    changed_in: "3.0"
    summary: |
      Now also accepts a single number (applies to XY only, Z = 0), in addition
      to the previous 2-element array [XYAdj, ZAdj].

  - name: connectors
    changed_in: "3.0"
    summary: |
      Completely new format: [face, direction, gender, align?, paddingStart?, paddingEnd?]
      per connector. The old [[side, arrangement]] format is no longer valid.
      Padding is now per-connector; the separate connectorPadding parameter is removed.

  - name: pcb
    changed_in: "3.0"
    summary: |
      Now accepts mounting type values directly: false/"none", "clips", "sockets".
      Merges the former pcb (bool) and pcbMountingType ("clips"|"screws") parameters.


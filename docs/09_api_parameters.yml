    type: string
    unit: dimensionless
    default: ""
    ai_usage: yes
    description: |
      Text to draw on the brick. If not empty, rendered on the side
      specified by textSide.

  - name: textFace
    group: text
    type: int_or_string
    values: [0, 1, 2, 3, 4, 5]
    unit: dimensionless
    default: 0
    ai_usage: yes
    description: |
      Side of the brick on which text is displayed (0-5 or string "x-" etc.).
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"
    version_history:
      - version: "2"
        description: "Named textSide in V2."
      - version: "3.0"
        description: "Renamed to textFace."

  - name: textDepth
    group: text
    type: float
    unit: mbu
    default: -0.25
    ai_usage: yes
    description: |
      Depth/height of the text. Negative = engraved. Positive = raised.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  - name: textFont
    group: text
    type: string
    unit: dimensionless
    default: "Liberation Sans"
    ai_usage: yes
    description: |
      Font family for the text.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  - name: textSize
    group: text
    type: float
    unit: pt
    default: 4
    ai_usage: yes
    description: |
      Font size of the text.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  - name: textSpacing
    group: text
    type: float
    unit: pt
    default: 1
    ai_usage: yes
    description: |
      Letter spacing of the text.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  - name: textAlign
    group: text
    type: enum_or_array
    values: ["start", "center", "end"]
    format: |
      Same syntax as align and alignChildren.
      String: "start" → ["start","start","start"]
      Shortcut string "ccs" → ["center","center","start"]
        Valid characters: c=center, s=start, e=end (any 3-char combination)
      Full array: ["start","center","end"]
      Invalid values are silently replaced with "start".
      X = horizontal alignment on the face surface.
      Y = vertical alignment on the face surface.
      Z = ignored for text.
    unit: dimensionless
    default: "ccc"
    since: "3.0"
    status: stable
    ai_usage: yes
    description: |
      Alignment of the text on the brick surface, using the same
      format as align and alignChildren.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"
    version_history:
      - version: "2"
        description: "Two separate parameters: textVerticalAlign and textHorizontalAlign (values: left/right/center)."
      - version: "3.0"
        description: "Merged into textAlign using start/center/end convention, same format as align."

  - name: textOffset
    group: text
    type: array
    format: "[x, y]"
    unit: unitGrid
    default: [0, 0]
    ai_usage: yes
    description: |
      Offset of the text from its normal position.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"

  - name: textColor
    group: text
    type: color
    format: "Hex RGB '#ff00ff', Hex RGBA '#ff00ffaa', or RGBA float array [0..1, 0..1, 0..1, 0..1]"
    unit: dimensionless
    default: "#2c3e50"
    ai_usage: yes
    description: |
      Color of the text. Independent from baseColor.
    constraints:
      requires:
        - parameter: text
          condition: "text is not empty"


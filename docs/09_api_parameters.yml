# ============================================================================
# MachineBlocks Parameter Reference
# Single Source of Truth for all mb_block() parameters
# ============================================================================
#
# This document is the authoritative specification for all parameters
# accepted by mb_block(config, settings). It is designed for AI consumption
# and deterministic code generation.
#
# All other documents in this project reference this file.
# If a conflict exists between this file and any other document,
# this file is authoritative for parameter definitions.
#
# ============================================================================

version: "3.0.2"

# ============================================================================
# GLOBAL RULES
# ============================================================================

global_rules:

  parameter_resolution:
    order: ["settings", "config", "default"]
    description: |
      The library always resolves every parameter in this order:
      1. Read from settings (instance-level)
      2. If missing, read from config (environment-level)
      3. If still missing, use the default value

      This applies universally to all parameters. The library does not
      restrict any parameter to config-only or settings-only at the
      resolution level.

      Individual block modules may assume certain parameters are always
      provided in settings, but this is a module-level decision, not a
      library-level restriction.

    ai_guidance: |
      The ai_usage field on each parameter is a recommendation for AI
      systems generating block code:
      - "yes": safe to use in settings for individual bricks
      - "rarely": usually not needed, but safe if intentional
      - "config_only": AI should only place this in config, not in
        per-brick settings. Typically calibration/adjustment values.
      - "never": do not use at all, internal constant

      These are AI generation guidelines, not library enforcement rules.

  parameter_access:
    description: |
      All parameters listed in this document are NATIVE parameters — they are
      used directly by mb_block(). Every native parameter has a dedicated
      getter function:

        mb_param_{parameterName}(config, settings)
        mb_param_{parameterName}(config, settings, defaultOverride)

      Custom parameters defined by individual block modules use the generic
      getter:

        mb_param(config, settings, "parameterName", defaultValue)

      Block modules MUST use the dedicated getter for native parameters.
      Direct array access is not permitted.

  getter_format_resolution:
    description: |
      Native parameter getters automatically resolve external input formats
      to internal formats. Examples:

      mb_param_direction() returns int:
        "west" → 0, "north" → 1, "east" → 2, "south" → 3

      mb_param_baseAdjustment() returns the pseudo-map as-is:
        [["x-", -0.1], ["z+", 0.1]] → [["x-", -0.1], ["z+", 0.1]]
        mb_block() interprets only standard sides x-, x+, y-, y+, z-, z+

      All per-side parameters follow the same resolution pattern.

  customizer_defaults:
    description: |
      Default slider ranges for the OpenSCAD customizer when no explicit
      range is specified per parameter:

      unitGrid parameters:
        step: 0.25, min: 0, max: 32
        Exception — size: min is 1 (not 0), integer values only

      mbu parameters (XY context):
        step: 0.125, min: 0, max: 160

      mbu parameters (Z context):
        step: 0.125, min: 0, max: 64

      Individual parameters may override these defaults. The override is
      noted in the customizer_range field of that parameter.

  unit_system:
    mbu:
      description: |
        MachineBlocks Base Unit. Most geometry parameters are expressed as
        multiples of unitMbu. Default: 1.6 mm.
    unitGrid:
      description: |
        Grid unit expressing the size of a 1x1 plate in mbu.
        Default: [5, 2] meaning X/Y = 5 mbu, Z = 2 mbu.
        Used as the reference for size, offset, crop, and many other parameters.
    mm:
      description: |
        Millimeters. Used exclusively for Adjustment/Clearance calibration parameters
        and certain absolute values (pcb*, screwHole*, topPlateHelper*,
        clamp thicknesses). mm values do NOT scale with the scale parameter.
    pt:
      description: |
        Points. Used only for text parameters (textSize, textSpacing).
    unitGrid_for_rounding:
      description: |
        All rounding radii use unitGrid as their unit.
        Z-axis radii use unitGrid[0], XY-axis radii use unitGrid[1].
        A Z-radius of 1 equals the width of a 1x1 plate.

  mm_to_absolute:
    formula: |
      absolute_mm = size[i] * unitGrid[0 or 1] * unitMbu * scale
      X/Y use unitGrid[0], Z uses unitGrid[1]
    example: |
      size = [4, 2, 3], unitMbu = 1.6, unitGrid = [5, 2], scale = 1
      absolute = [4*5*1.6, 2*5*1.6, 3*2*1.6] = [32, 16, 9.6] mm

  critical_proportion_rule:
    description: |
      CRITICAL: X/Y and Z axes are NOT equally scaled in the grid system.

      1 unit in X or Y = unitGrid[0] * unitMbu = 5 * 1.6 = 8.0 mm
      1 unit in Z      = unitGrid[1] * unitMbu = 2 * 1.6 = 3.2 mm

      The ratio is unitGrid[0] / unitGrid[1] = 5 / 2 = 2.5
      This means Z must be 2.5× larger than X/Y to produce equal physical
      dimensions.

      Examples:
        size = [1, 1, 1]   → 8 × 8 × 3.2 mm  (NOT a cube — heavily squashed in Z)
        size = [1, 1, 2.5] → 8 × 8 × 8.0 mm  (true cube, but Z is fractional)
        size = [2, 2, 5]   → 16 × 16 × 16 mm  (true cube with integer values)
        size = [4, 4, 4]   → 32 × 32 × 12.8 mm (NOT a cube — common AI mistake)
        size = [4, 4, 10]  → 32 × 32 × 32 mm  (true cube)

    ai_rule: |
      When designing blocks that should have specific physical proportions,
      ALWAYS calculate the absolute mm dimensions to verify proportions.
      Never assume equal grid units produce equal physical dimensions.

      IMPORTANT: Always use integer values for size to maintain LEGO grid
      compatibility. Do NOT use fractional values like 2.5 — instead, choose
      the nearest integer that best approximates the desired proportion.
      Proportions will often be approximate, and that is acceptable.

      Quick reference for proportional sizing:
        For every 1 unit in X/Y, use 2 or 3 units in Z (exact would be 2.5).
        For every 2 units in X/Y, use 5 units in Z.
        For every 4 units in X/Y, use 10 units in Z.

      Practical approach:
        1. Think in mm first for the desired physical shape.
        2. Convert to grid units: x = mm/8, y = mm/8, z = mm/3.2
        3. Round all values to integers.
        4. Verify the resulting mm dimensions are acceptable.

      Example — designing a roughly cubic block:
        Target: ~24mm cube
        x = 24/8 = 3, y = 24/8 = 3, z = 24/3.2 = 7.5 → round to 7 or 8
        size = [3, 3, 8] → 24 × 24 × 25.6 mm (close enough)
        size = [3, 3, 7] → 24 × 24 × 22.4 mm (also acceptable)
        
  side_index:
    description: |
      Side numbering convention used throughout MachineBlocks.
      Always defined in west orientation. Never remapped by direction.
    sides:
      0: "x- (left)"
      1: "x+ (right)"
      2: "y- (front)"
      3: "y+ (back)"
      4: "z- (bottom)"
      5: "z+ (top)"

  corner_index:
    description: |
      Corner numbering per axis (0-3).
      When viewed frontally along the direction of an axis, numbering begins
      at the corner closest to the brick origin and proceeds clockwise.
      Exception: Z-axis uses inverted view direction (top to bottom).
    corners:
      0: "Nearest to brick origin"
      1: "90° clockwise from corner 0"
      2: "Diagonally opposite of corner 0"
      3: "90° counterclockwise from corner 0"

  transformation_order:
    description: |
      The strict order in which transformations are applied to a brick:
    steps:
      1: "Calculate brick geometry"
      2: "Draw brick"
      3: "Draw children (optional)"
      4: "Apply direction"
      5: "Apply align"
      6: "Apply rotationOffset"
      7: "Apply rotation"
      8: "Apply rotationOffsetRevert"
      9: "Apply offset"

  adjustment_parameters:
    description: |
      All parameters containing "Adjustment" in their name are calibration
      parameters. They are always in mm and never scale with the scale parameter.
    ai_rule: |
      AI must NOT use adjustment parameters in settings to modify individual bricks.
      AI MAY use them in config to assist the user with printer/material calibration.
      The primary calibration entry point is sizeAdjustment in config.

  selective_array_format:
    description: |
      Several parameters (studs, pillars, holeX, holeY, holeZ) support a
      selective array format for per-region control:
      [default_value, [x1, y1, x2, y2, value], [x1, y1, x2, y2, value], ...]
      - First element: default for all positions (bool)
      - Following arrays: regions with overriding value
      - Coordinates reference the stud grid from (0,0) in x+/y+ direction
      - The last value can be bool (true/false) or a type string
        ("hollow"/"solid" for studs, "pin"/"axle" for holes)

  per_side_format:
    description: |
      Several parameters (crop, studPadding, recessWallThickness, recessStudPadding)
      support a per-side format:
      - Float: applies to all 4 sides equally
      - 2-element array [X, Y]: X for x-(0) and x+(1), Y for y-(2) and y+(3)
      - 4-element array [x-(0), x+(1), y-(2), y+(3)]: each side individually
      Side indices follow the standard side_index convention (0-3 only).

      Note: baseSideAdjustment uses the pseudo-map format instead (see its definition).

  constraint_format:
    description: |
      Parameters may include a constraints field describing relationships
      with other parameters. Constraint types:
      - conflicts_with: cannot be used together with the listed parameters
      - requires: only meaningful when the listed condition is met
      - affects: this parameter influences the behavior of listed parameters
      - affected_by: this parameter's behavior is influenced by listed parameters

  side_reference_format:
    description: |
      All parameters that reference sides support two equivalent formats:
      integer indices (0-5) and string identifiers ("x-", "x+", "y-", "y+", "z-", "z+").
    mapping:
      0: "x-"
      1: "x+"
      2: "y-"
      3: "y+"
      4: "z-"
      5: "z+"
    ai_rule: |
      The preferred format from V3 onwards is the string form ("x-", "x+", etc.).
      When generating new blocks or converting legacy blocks, always use string
      side identifiers. Integer indices remain valid and are accepted everywhere.
    version_history:
      - version: "2"
        description: "Side references were integers only (0-5)."
      - version: "3.0"
        description: |
          String side identifiers added as an equivalent alternative.
          Strings are now the preferred format for readability.
          All parameters that previously accepted only integers now also accept strings.

# ============================================================================
# PARAMETERS
# ============================================================================

parameters:

  # --------------------------------------------------------------------------
  # GROUP: System / Units
  # --------------------------------------------------------------------------

  - name: unitMbu
    group: system
    type: float
    unit: mm
    default: 1.6
    since: "2"
    status: stable
    ai_usage: rarely
    description: |
      Base unit of the MachineBlocks system in millimeters.
      All grid-based size values are multiples of this unit.
      Adjustment parameters are exempt (always in mm).
    deleted_in_v3: false
    renamed_from_v2: unitMbuToMm
    version_history:
      - version: "2"
        description: "Named unitMbuToMm in V2."
      - version: "3.0"
        description: "Renamed to unitMbu."

  - name: unitGrid
    group: system
    type: array
    format: "[xy_mbu, z_mbu]"
    unit: mbu
    default: [5, 2]
    since: "2"
    status: stable
    ai_usage: rarely
    description: |
      Grid size in mbu, representing a 1x1 plate.
      X and Y share the first value, Z uses the second.
      A 1x1 plate = 5×5×2 mbu = 8×8×3.2 mm at default settings.
    version_history:
      - version: "2"
        description: "Named unitGridToMbu in V2."
      - version: "3.0"
        description: "Renamed to unitGrid."

  - name: scale
    group: system
    type: float
    unit: dimensionless
    default: 1.0
    since: "2"
    status: stable
    ai_usage: yes
    description: |
      Global scaling factor. Scales all mbu-based values.
      mbu values themselves remain unchanged; only the resulting
      physical dimensions change. Adjustments (mm) do NOT scale.
    example: "scale = 2 produces a brick twice the physical size"

  - name: printerNozzleDiameter
    group: system
    type: float
    unit: mm
    default: 0.4
    since: "3.0"
    status: stable
    ai_usage: config_only
    description: |
      Nozzle diameter of the 3D printer in mm. Typically set once in the
      global config. Used as the default value for other parameters when
      those parameters are set to "auto".

      Current auto-resolution rules:
        topPlateHelperThickness = "auto"  →  0.5 * printerNozzleDiameter (min 0.1 mm)
        tongueGrooveThicknessClearance = "auto"  →  0.25 * printerNozzleDiameter (min 0.1 mm)
        Any future *NozzleDiameter-based "auto" parameter follows the same min 0.1 mm rule.

  - name: printerLayerHeight
    group: system
    type: float
    unit: mm
    default: 0.2
    since: "3.0"
    status: stable
    ai_usage: config_only
    description: |
      Layer height of the 3D printer in mm. Typically set once in the
      global config. Used as the default value for other parameters when
      those parameters are set to "auto".

      Current auto-resolution rules:
        topPlateHelperHeight = "auto"  →  printerLayerHeight
        stabilizerLayerOffset = "auto"  →  printerLayerHeight
        screwHoleZHelperLayerOffset = "auto"  →  printerLayerHeight
        tongueGrooveDepthClearance = "auto"  →  printerLayerHeight
        tongueGrooveClampOffsetClearance = "auto"  →  printerLayerHeight


    type: string
    unit: dimensionless
    default: ""
    since: "3.0"
    status: stable
    ai_usage: yes
    description: |
      Unique identifier of the block or part within a block tree. Used primarily
      for debug output in mb_block() so that console messages can be clearly
      attributed to a specific block or part. May gain additional functions in
      the future.

      In composite blocks, blockId is resolved via mb_param_id() and then
      assigned to the wrapper block and all parts:

        blockId = mb_param_id(config, settings, "mm.my.package");
        // Wrapper block:
        ["id", blockId]
        // Part:
        ["id", mb_block_id(blockId, part_bottom)]

      mb_block_id(blockId, partName) produces a combined ID in the form
      "blockId/partName". Since blockId can be overridden from outside, this
      creates traceable, hierarchical ID chains across composite block trees.

      Example: if blockId = "mm.anyclosure.wall" and partName = "bottom",
      the resulting part ID is "mm.anyclosure.wall/bottom".

  - name: debug
    group: system
    type: bool
    unit: dimensionless
    default: false
    since: "3.0"
    status: stable
    ai_usage: yes
    description: |
      Enables debug output to the console. Has no effect on geometry.
      Used for development and troubleshooting.

  - name: render
    group: system
    type: bool
    unit: dimensionless
    default: true
    since: "3.0"
    status: stable
    ai_usage: yes
    description: |
      Whether the block is rendered at all. When false, the block and all
      its children produce no geometry. Used in composite blocks to
      conditionally show or hide individual parts based on assemblyParts.
    example: |
      ["render", mb_group_render(renderGroups, "bottom")]

  # --------------------------------------------------------------------------
  # GROUP: Core Geometry
  # --------------------------------------------------------------------------

  - name: size
    group: core_geometry
    type: array
    format: "[x, y, z]"
    unit: unitGrid (multiples of a 1x1 plate)
    default: [1, 1, 1]
    customizer_range: "[1:1:32]"
    ai_usage: yes
    description: |
      Size of the bounding box in grid units. Defines the brick body;
      studs are excluded from the bounding box. For simple bricks the
      bounding box matches the body exactly.
      X/Y count in studs, Z counts in plates.
      Must contain integer values only. Fractional values are not permitted.
    version_history:
      - version: "3.0"
        description: "size values are restricted to integers. Fractional values were accepted in V2."

  - name: sizeMod
    group: core_geometry
    type: array
    format: "[x-, x+, y-, y+, z-, z+] — per-side modification in unitGrid"
    unit: unitGrid
    default: [0, 0, 0, 0, 0, 0]
    since: "3.0"
    status: stable
    ai_usage: yes
    description: |
      Semantic size modification per side, in grid units. Adjusts the
      brick geometry while keeping it structurally intact (walls, studs,
      connectors remain consistent). Unlike crop, sizeMod does not brutally
      cut geometry — it semantically shifts where the brick starts/ends on
      each side.

      Example: sizeMod = [0.5, 0, 0, 0, 0, 0] shifts the x- side inward
      by 0.5 grid units, producing a half-brick that starts at 0.5 grid
      units from the original x- edge.

      z- behaviour: negative z- values shift the brick downward by the
      same amount (like a downward offset), independent of the regular
      offset parameter. The z+ side is extended correspondingly.

      Difference to baseAdjustment: sizeMod is a semantic geometry change
      (half-bricks, partial bricks). baseAdjustment is for printer
      calibration and gap closing in composite blocks.

  - name: slope
    group: core_geometry
    type: array_or_false
    format: "[side0, side1, side2, side3] or false"
    unit: unitGrid (plates)
    default: false
    ai_usage: yes
    description: |
      Defines slopes per side (0-3).
      Positive values: slope on top surface (z+), starting at slopeBaseHeightBottom
      and going the specified number of plates toward the center upward.
      Negative values: inverted slope on bottom surface (z-), starting at
      blockHeight - slopeBaseHeightTop going down to the floor.
      Slope and bevel can be used together.
    example: "[1,0,0,0] creates a slope on side 0 (x-), 1 plate wide"

  - name: slopeBaseHeightBottom
    group: core_geometry
    type: float
    unit: mbu
    default: 1.333
    ai_usage: rarely
    description: |
      Start height of the slope on the respective side for positive slopes.
      Usually does not need adjustment.
    constraints:
      requires:
        - parameter: slope
          condition: "slope is not false"
    version_history:
      - version: "2"
        description: "Named slopeBaseHeightLower in V2."
      - version: "3.0"
        description: "Renamed to slopeBaseHeightBottom."

  - name: slopeBaseHeightInner
    group: core_geometry
    type: float
    unit: mbu
    default: 1.125
    ai_usage: rarely
    description: |
      Start height of the slope on the inner wall of the brick.
      Usually does not need adjustment.
    constraints:
      requires:
        - parameter: slope
          condition: "slope is not false"
    version_history:
      - version: "2"
        description: "Named slopeBaseHeightLowerInner in V2."
      - version: "3.0"
        description: "Renamed to slopeBaseHeightInner."

  - name: slopeBaseHeightTop
    group: core_geometry
    type: float
    unit: mbu
    default: 1
    ai_usage: rarely
    description: |
      Height subtracted from block height for inverted (negative) slopes.
      Usually does not need adjustment.
    constraints:
      requires:
        - parameter: slope
          condition: "slope contains negative values"
    version_history:
      - version: "2"
        description: "Named slopeBaseHeightUpper in V2."
      - version: "3.0"
        description: "Renamed to slopeBaseHeightTop."

  - name: bevel
    group: core_geometry
    type: array
    format: "[[x0,y0], [x1,y1], [x2,y2], [x3,y3]]"
    unit: unitGrid (plates)
    default: [[0,0], [0,0], [0,0], [0,0]]
    ai_usage: yes
    description: |
      Creates wedges by shifting Z-axis corners (0-3) in XY space.
      Each corner gets an [x,y] displacement value.
      The resulting shape is intersected with the bounding box.
      Can be used together with slope.
    example: |
      [[0,3],[0,0],[2,0],[0,0]] shifts corner 0 by 3 plates in y+
      and corner 2 by 2 plates in x+.

  - name: crop
    group: core_geometry
    type: float_or_array
    format: |
      Float: all 4 sides equal.
      2-element array [X, Y]: X for x-(0) and x+(1), Y for y-(2) and y+(3).
      4-element array [x-(0), x+(1), y-(2), y+(3)]: each side individually.
    unit: unitGrid
    default: 0
    customizer_range: "[-32:0.25:32]"
    ai_usage: yes
    description: |
      Hard cut or extension per side (0-3 only, no Z-axis crop).
      Positive = cut geometry, negative = extend geometry.
      The cut is applied brutally — without regard to grid compatibility,
      walls, tubes, or other structural features.
      Does NOT affect bounding box or positioning.
      For semantic size modification that keeps the brick structurally intact,
      use sizeMod instead. crop is intended for cross-sections, screenshots,
      or helper bricks — not for normal size adjustment.
    version_history:
      - version: "2"
        description: "crop attempted to preserve grid compatibility in some cases."
      - version: "3.0"
        description: |
          crop is now a hard cut in all cases, with no regard for grid
          compatibility, walls, or structure. Use sizeMod for semantic
          size changes that preserve brick integrity.

  - name: cutouts
    group: core_geometry
    type: array_or_false
    format: |
      false: no cutouts.
      Array of settings arrays: each inner array is a list of key-value pairs
      using native parameter names to define one cutout volume.
      Supported parameters per cutout: size, offset, bevel, slope, crop,
      baseSideAdjustment, baseHeightAdjustment, and any other parameters
      that affect the shape or size of a volume.
      Parameters that only affect surface features or rendering are ignored.
    unit: mixed (follows individual parameter units)
    default: false
    since: "3.0"
    status: experimental
    ai_usage: never
    description: |
      Defines one or more void volumes to subtract from the block body.
      Each entry in the array is a settings array describing one cutout.
      The subtraction is applied brutally — it ignores walls, recess,
      tongue, and all structural features. The cutout cuts through everything.
    example: |
      cutouts = [
        [["size", [1, 1, 1]], ["offset", [0, 1, 1]]],
        [["size", [1, 2, 3]], ["offset", [2, 1, 4]]]
      ]

  # --------------------------------------------------------------------------
  # GROUP: Positioning / Transformation
  # --------------------------------------------------------------------------

  - name: direction
    group: positioning
    type: enum
    values: ["west", "north", "east", "south"]
    unit: dimensionless
    default: "west"
    ai_usage: yes
    description: |
      Semantic grid-aligned rotation. Applied before align.
      west=0°, north=90°, east=180°, south=270° (clockwise).
      All internal values (size, side numbering, etc.) always refer to
      "west" orientation. Direction only changes placement/display.
      Before align is applied the brick is centered on its body center.
    example: "size=[4,2,3] with direction=north → effective footprint [2,4,3]"

  - name: align
    group: positioning
    type: enum_or_array
    values: ["start", "center", "end"]
    format: |
      String: "start" → ["start","start","start"]
      Shortcut string "ccs" → ["center","center","start"]
        Valid characters: c=center, s=start, e=end (any 3-char combination)
      Full array: ["start","center","end"]
      Invalid values are silently replaced with "start".
    unit: dimensionless
    default: "start"
    since: "2"
    status: stable
    ai_usage: yes
    description: |
      Alignment relative to the origin, per axis.
      "start" = toward x-/y-/z-, "end" = toward x+/y+/z+.
      Origin is [0,0,0] globally, or defined by parent's alignChildren.
      Alignment is based strictly on the bounding box.
    version_history:
      - version: "2"
        description: "Basic string and array formats supported."
      - version: "3.0"
        description: |
          mb_param_align() now always resolves to a 3-element array internally.
          Shortcut strings (e.g. "ccs") are fully resolved by the getter.
          Invalid characters in shortcut strings are replaced with "start".
          Examples: "ccs" → ["center","center","start"],
          "sdkds" → ["start","start","start"],
          ["sdsf","center","end"] → ["start","center","end"]

  - name: alignChildren
    group: positioning
    type: enum_or_array
    values: ["start", "center", "end"]
    format: |
      String: "start" → ["start","start","start"]
      Shortcut string "ccs" → ["center","center","start"]
        Valid characters: c=center, s=start, e=end (any 3-char combination)
      Full array: ["start","center","end"]
      Invalid values are silently replaced with "start".
    unit: dimensionless
    default: "start"
    since: "2"
    status: stable
    ai_usage: yes
    description: |
      Defines the origin inside a parent brick for child positioning.
      Same convention as align. Children use this as their reference point.
    version_history:
      - version: "3.0"
        description: |
          mb_param_alignChildren() now always resolves to a 3-element array.
          Same resolution rules as align.

  - name: offset
    group: positioning
    type: array
    format: "[x, y, z]"
    unit: unitGrid
    default: [0, 0, 0]
    ai_usage: yes
    description: |
      Final displacement of the brick. Applied last in the transformation
      chain. Same unit as size (grid units / multiples of a 1x1 plate).
      Origin depends on whether the brick is global or a child.

  - name: rotation
    group: positioning
    type: array
    format: "[x, y, z]"
    unit: degrees
    default: [0, 0, 0]
    ai_usage: rarely
    description: |
      Free geometric rotation applied after align. Not grid-safe —
      can break alignment and connectivity. The pivot is the relative
      zero point which varies depending on align. Children are rotated
      along with the parent.
    warning: "Last-resort transformation. Use direction for grid-aligned orientation."

  - name: rotationOffset
    group: positioning
    type: array
    format: "[x, y, z]"
    unit: unitGrid
    default: [0, 0, 0]
    ai_usage: rarely
    description: |
      Shifts the rotation pivot before rotation is applied.
    constraints:
      requires:
        - parameter: rotation
          condition: "rotation is not [0,0,0]"

  - name: rotationOffsetRevert
    group: positioning
    type: bool
    unit: dimensionless
    default: true
    ai_usage: rarely
    description: |
      Whether the rotationOffset is reversed after rotation.
    constraints:
      requires:
        - parameter: rotationOffset
          condition: "rotationOffset is not [0,0,0]"

  # --------------------------------------------------------------------------
  # GROUP: Body
  # --------------------------------------------------------------------------

  - name: base
    group: body
    type: bool
    unit: dimensionless
    default: true
    ai_usage: yes
    description: |
      Whether the base body is drawn. Purely visual — no effect on
      bounding box, align, size, or calculations. Other features (studs,
      text, etc.) are controlled separately.
    use_cases:
      - "Wrapper blocks without own body"
      - "Multiline text (plate with body + bricks with base=false for text only)"
      - "Composite bricks where only certain features are drawn in a sub-brick"

  - name: baseColor
    group: body
    type: color
    format: "Hex RGB '#ff00ff', Hex RGBA '#ff00ffaa', or RGBA float array [0..1, 0..1, 0..1, 0..1]"
    unit: dimensionless
    default: "#EAC645"
    ai_usage: yes
    description: |
      Color of the brick body, studs, and all other parts.
      Does NOT apply to text (use textColor separately).

  # baseHeight removed in V3 — see removed_in_v3 section.

  # --------------------------------------------------------------------------
  # GROUP: Top Plate
  # --------------------------------------------------------------------------

  - name: topPlateHeight
    group: top_plate
    type: float
    unit: mbu
    default: 1
    ai_usage: rarely
    description: |
      Preferred height of the top plate (upper ceiling of the base body).
      Actual height may differ depending on baseCutoutMaxDepth and
      recess depth. Usually does not need adjustment.
    version_history:
      - version: "2"
        description: "Named baseTopPlateHeight in V2."
      - version: "3.0"
        description: "Renamed to topPlateHeight."

  - name: topPlateHeightAdjustment
    group: top_plate
    type: float
    unit: mm
    default: -0.6
    ai_usage: config_only
    description: |
      Calibration adjustment for topPlateHeight.
      Only for calibration/printer compensation.
    version_history:
      - version: "2"
        description: "Named baseTopPlateHeightAdjustment in V2."
      - version: "3.0"
        description: "Renamed to topPlateHeightAdjustment."

  # --------------------------------------------------------------------------
  # GROUP: Underside / Base Cutout
  # --------------------------------------------------------------------------

  - name: baseCutoutType
    group: underside
    type: enum
    values: ["standard", "studs", "groove", "none"]
    unit: dimensionless
    default: "standard"
    ai_usage: yes
    description: |
      Type of underside opening.
      standard: Classic LEGO underside with tubes/pins.
      studs: Alternative with only stud holes, no tube structure.
        Grid-compatible but only fits exactly on studs.
      groove: Counterpart to tongue — a groove that the tongue fits into.
      none: Solid underside, no opening. For solid structures in composite
        blocks, e.g. embedded blocks without their own underside.

  - name: baseCutoutMaxDepth
    group: underside
    type: float
    unit: mbu
    default: 5
    ai_usage: rarely
    description: |
      Maximum depth of the underside opening (baseCutoutType=standard only).
      Default 5 mbu ≈ 8 mm. Limits underside depth; if the limit applies,
      the topPlateHeight grows accordingly. When recess is defined, the
      baseCutoutDepth shrinks to the minimum (1 mbu) and topPlateHeight
      shrinks to topPlateHeight.
    constraints:
      requires:
        - parameter: baseCutoutType
          condition: "baseCutoutType = 'standard'"

  - name: baseWallThickness
    group: underside
    type: float_or_auto
    unit: mbu
    default: "auto"
    ai_usage: rarely
    description: |
      Wall thickness of the underside opening (baseCutoutType=standard).
      Automatically calculated. Usually does not need adjustment.
    constraints:
      requires:
        - parameter: baseCutoutType
          condition: "baseCutoutType = 'standard'"

  - name: baseWallThicknessAdjustment
    group: underside
    type: float
    unit: mm
    default: -0.1
    ai_usage: config_only
    description: |
      Calibration adjustment for baseWallThickness.
      Only for calibration. Not for AI in settings.

  - name: baseWallGaps
    group: underside
    type: array
    format: |
      Array of [side, position, length] entries.
      - side: side string ("x-", "x+", "y-", "y+") or int (0-3).
        Only one side per entry. To open both sides at a position, add two entries.
      - position: stud index along the axis
      - length: gap length in 1x1 bricks (optional, defaults to 1)
    unit: "position in studs, length in 1x1 bricks"
    default: []
    since: "3.0"
    status: stable
    ai_usage: yes
    description: |
      Gaps in the underside wall (baseCutoutType=standard).
      Used to restore grid compatibility in composite blocks where blocks cross.
      Replaces baseWallGapsX and baseWallGapsY from V2.
      Each entry specifies one side, a position, and optionally a length.
      To open both sides at a position, add two separate entries.
    constraints:
      requires:
        - parameter: baseCutoutType
          condition: "baseCutoutType = 'standard'"
    example: |
      [["x-", 0], ["x+", 0], ["x-", 3], ["x+", 3]]
    version_history:
      - version: "3.0"
        description: |
          Replaces baseWallGapsX and baseWallGapsY.
          Side specified as string ("x-", "x+", "y-", "y+") or int.
          Each entry opens only one side.

  # --------------------------------------------------------------------------
  # GROUP: Base Clamp
  # --------------------------------------------------------------------------

  - name: baseClampOffset
    group: base_clamp
    type: float
    unit: mbu
    default: 0.25
    ai_usage: rarely
    description: |
      Distance from the bottom edge of the block to the base clamp lip.
      The base clamp is a small lip on the inner wall of the underside
      opening, around tubes, and in stud holes (baseCutoutType=studs)
      that increases clamping force.

  - name: baseClampHeight
    group: base_clamp
    type: float
    unit: mbu
    default: 0.5
    ai_usage: rarely
    description: |
      Height of the base clamp lip.

  - name: baseClampThickness
    group: base_clamp
    type: float
    unit: mm
    default: 0.1
    ai_usage: rarely
    description: |
      Thickness of the base clamp lip.

  - name: baseClampOuter
    group: base_clamp
    type: bool
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether a clamp lip is also placed on the outer side of the block.
      Not useful for normal bricks. Useful in composite blocks where an
      outer surface of a sub-brick becomes an inner surface in the
      overall block.

  # --------------------------------------------------------------------------
  # GROUP: Rounding
  # --------------------------------------------------------------------------

  - name: baseRoundingRadius
    group: rounding
    type: float_or_array
    format: |
      Float: all corners all axes.
      3-element array [x, y, z]: per axis, all 4 corners.
      3-element array of 4-element arrays [[c0,c1,c2,c3], ...]: per axis per corner.
    unit: unitGrid (Z-radii use unitGrid[0], XY-radii use unitGrid[1])
    default: 0.0
    ai_usage: yes
    description: |
      Rounding radius of the block corners.

  - name: baseCutoutRoundingRadius
    group: rounding
    type: float_or_array
    format: "Float (all 4 Z-corners) or 4-element array (each Z-corner individually)"
    unit: unitGrid
    default: "auto"
    ai_usage: rarely
    description: |
      Rounding radius of the inner underside opening (baseCutoutType=standard).
      Z-direction only. Automatically derived from baseRoundingRadius.
      Usually does not need adjustment.
    constraints:
      requires:
        - parameter: baseCutoutType
          condition: "baseCutoutType = 'standard'"

  # --------------------------------------------------------------------------
  # GROUP: Relief Cut
  # --------------------------------------------------------------------------

  - name: reliefCut
    group: relief_cut
    type: bool
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether a relief cut is applied at the outer bottom edge of the block.
      Cuts a portion of the outer wall, resulting in a thinner outer wall
      in the lower area. The inner wall is not affected (baseCutoutType=standard).
    version_history:
      - version: "2"
        description: "Named baseReliefCut in V2."
      - version: "3.0"
        description: "Renamed to reliefCut."

  - name: reliefCutHeight
    group: relief_cut
    type: float
    unit: mbu
    default: 0.375
    ai_usage: rarely
    description: |
      Height of the relief cut.
    constraints:
      requires:
        - parameter: reliefCut
          condition: "reliefCut = true"
    version_history:
      - version: "2"
        description: "Named baseReliefCutHeight in V2."
      - version: "3.0"
        description: "Renamed to reliefCutHeight."

  - name: reliefCutThickness
    group: relief_cut
    type: float
    unit: mbu
    default: 0.375
    ai_usage: rarely
    description: |
      Thickness of the cut-away portion.
    constraints:
      requires:
        - parameter: reliefCut
          condition: "reliefCut = true"
    version_history:
      - version: "2"
        description: "Named baseReliefCutThickness in V2."
      - version: "3.0"
        description: "Renamed to reliefCutThickness."

  # --------------------------------------------------------------------------
  # GROUP: Side / Height Adjustment (Calibration)
  # --------------------------------------------------------------------------

  - name: baseAdjustment
    group: calibration
    type: array
    format: |
      Pseudo-map: array of [side, value_mm] pairs.
        [["x-", 0], ["z+", 0.1]]
      Sides may be specified as strings ("x-", "x+", "y-", "y+", "z-", "z+")
      or integers (0-5). String format is preferred.
      mb_block() interprets only the standard sides: x-, x+, y-, y+, z-, z+.
      Default: [] (empty — no per-side override).

      Namespace support: keys may include a namespace prefix separated by a dot.
        [["pbx.x+", 0.01], ["pty.z+", 0.1]]
      mb_block() ignores namespaced entries. They are intended for child
      composite blocks, which extract them via mb_params_filter().
    unit: mm
    default: []
    ai_usage: config_only
    description: |
      Per-side calibration adjustment in mm. Extends or reduces specific sides
      of a block. Never scales with the scale parameter.

      PRIMARY PURPOSE — Per-side fine-tuning:
      While sizeAdjustment provides global calibration, baseAdjustment
      allows per-side overrides including z- and z+ (which sizeAdjustment
      cannot address individually).

      z- SPECIAL BEHAVIOUR: A z- value does not reduce block height from below.
      Instead it shifts the brick downward by the z- amount (independent of
      offset), and extends z+ by the same amount. This means the brick gains
      a downward protrusion while the top side expands correspondingly.
      Same applies to sizeMod z-.

      Difference to sizeMod: baseAdjustment is for printer calibration and
      gap closing in composite blocks. sizeMod is a semantic geometry change.

      IN CONFIG — typically empty or used for global z+/z- adjustments.

      IN COMPOSITE BLOCKS — use namespaced entries to pass side-specific
      adjustments to child composite blocks. The child uses mb_params_filter()
      to extract its namespace:
        // In outer block:
        ["baseAdjustment", [["pbx.x+", 0.01], ["pty.z+", 0.1]]]
        // In inner composite block (pbx part):
        ["baseAdjustment", mb_params_filter(baseAdjustment, "pbx")]
        // Result: [["x+", 0.01]]

      mb_params_filter(param, namespace, overrides?):
        Filters a pseudo-map by namespace prefix, removes the prefix from keys.
        Ignores entries without a namespace and entries with numeric keys.
        Optional third argument applies fixed overrides after filtering.
        Universal — can be applied to any [[string, value]] pseudo-map parameter.
    version_history:
      - version: "2"
        description: "Named baseSideAdjustment in V2. Supported x-, x+, y-, y+, z+. Format changed from float/2-element/4-element array to pseudo-map."
      - version: "3.0"
        description: |
          Renamed to baseAdjustment. Now supports z- with special downward-shift
          behaviour. Default changed from -0.1 to [] (empty).

  - name: sizeAdjustment
    group: calibration
    type: array_or_number
    format: |
      Number: applies to all four horizontal sides (x-, x+, y-, y+). Z is 0.
      2-element array [sideXYAdj, heightAdj]: first value for x-, x+, y-, y+; second for z+.
    unit: mm
    default: [-0.1, 0]
    since: "3.0"
    status: stable
    ai_usage: config_only
    description: |
      Global calibration adjustment for block size, applied uniformly.
      sideXYAdj is applied to all four horizontal sides (x-, x+, y-, y+).
      heightAdj is applied to the top face (z+) only.

      Typically set once in the global config and applies to all blocks.
      For per-block or per-side overrides, use baseAdjustment.

      Example: [-0.1, 0] reduces x-, x+, y-, y+ by 0.1mm each, no height change.

      Never scales with the scale parameter.
    version_history:
      - version: "3.0"
        description: |
          New in V3. Now accepts a single number (applies to XY only, Z = 0)
          or a 2-element array [XYAdj, ZAdj].

  - name: recessAdjustment
    group: calibration
    type: array_or_auto
    format: |
      "auto": uses baseAdjustment values (except z+) automatically.
      Pseudo-map: array of [side, value_mm] pairs, same format as baseAdjustment.
    unit: mm
    default: "auto"
    since: "3.0"
    status: stable
    ai_usage: config_only
    description: |
      Per-side calibration adjustment for the inner recess walls and floor.
      Applied to the interior surfaces of the recess (the inner box).

      At "auto", uses the same values as baseAdjustment (except z+, which
      is not applicable to the recess).

      IMPORTANT — z- behaviour differs from baseAdjustment:
      The z- value is applied to the recess floor height (moves the floor).
      No downward shift or z+ extension occurs — it is a direct floor adjustment.

      Sign convention: negative values enlarge the recess (shrink the inner
      walls inward in x/y, and lower the floor in z-). Positive values
      shrink the recess.
    constraints:
      requires:
        - parameter: recess
          condition: "recess = true"

  # --------------------------------------------------------------------------
  # GROUP: Top Plate Helpers
  # --------------------------------------------------------------------------

  - name: topPlateHelpers
    group: print_helpers
    type: bool
    unit: dimensionless
    default: true
    ai_usage: rarely
    description: |
      Whether top plate helpers are active. A small frame that slightly
      widens the inner walls of the underside opening (baseCutoutType=standard).
      Improves adhesion when printing the ceiling (top plate).
      Two layers: horizontal (X-axis) then vertical (Y-axis).
      Usually active, does not need adjustment.
    constraints:
      requires:
        - parameter: baseCutoutType
          condition: "baseCutoutType = 'standard'"

  - name: topPlateHelperHeight
    group: print_helpers
    type: float_or_auto
    unit: mm
    default: "auto"
    ai_usage: rarely
    description: |
      Height of one top plate helper layer. Typically matches the 3D print
      layer height. The horizontal layer is effectively 2× this value as
      it is printed first.
      "auto" uses printerLayerHeight.
    constraints:
      requires:
        - parameter: topPlateHelpers
          condition: "topPlateHelpers = true"

  - name: topPlateHelperThickness
    group: print_helpers
    type: float_or_auto
    unit: mm
    default: "auto"
    ai_usage: rarely
    description: |
      Thickness of the top plate helpers in X/Y direction.
      "auto" uses 0.5 * printerNozzleDiameter (minimum 0.1 mm).
    constraints:
      requires:
        - parameter: topPlateHelpers
          condition: "topPlateHelpers = true"

  # --------------------------------------------------------------------------
  # GROUP: Stabilizer Grid
  # --------------------------------------------------------------------------

  - name: stabilizers
    group: print_helpers
    type: bool
    unit: dimensionless
    default: true
    ai_usage: rarely
    description: |
      Whether a stabilizer grid connecting tubes to side walls is printed
      (baseCutoutType=standard). Provides stability and improves
      printability of the top plate. Usually does not need adjustment.
    constraints:
      requires:
        - parameter: baseCutoutType
          condition: "baseCutoutType = 'standard'"
    version_history:
      - version: "2"
        description: "Named stabilizerGrid in V2."
      - version: "3.0"
        description: "Renamed to stabilizers."

  - name: stabilizerLayerOffset
    group: print_helpers
    type: float_or_auto
    unit: mm
    default: "auto"
    ai_usage: rarely
    description: |
      Offset between the first and subsequent grid layers.
      Ensures subsequent layers have a surface to print on.
      "auto" uses printerLayerHeight.
    constraints:
      requires:
        - parameter: stabilizers
          condition: "stabilizers = true"
    version_history:
      - version: "2"
        description: "Named stabilizerGridOffset in V2."
      - version: "3.0"
        description: "Renamed to stabilizerLayerOffset. Supports 'auto' (uses printerLayerHeight)."

  - name: stabilizerHeight
    group: print_helpers
    type: float
    unit: mbu
    default: 0.5
    ai_usage: rarely
    description: |
      Height of the stabilizer grid.
    constraints:
      requires:
        - parameter: stabilizers
          condition: "stabilizers = true"
    version_history:
      - version: "2"
        description: "Named stabilizerGridHeight in V2."
      - version: "3.0"
        description: "Renamed to stabilizerHeight."

  - name: stabilizerThickness
    group: print_helpers
    type: float
    unit: mbu
    default: 0.5
    ai_usage: rarely
    description: |
      Width of a single grid strut.
    constraints:
      requires:
        - parameter: stabilizers
          condition: "stabilizers = true"
    version_history:
      - version: "2"
        description: "Named stabilizerGridThickness in V2."
      - version: "3.0"
        description: "Renamed to stabilizerThickness."

  - name: stabilizerExpansion
    group: print_helpers
    type: int
    unit: dimensionless
    default: 2
    ai_usage: rarely
    description: |
      If > 0, every n-th grid element is taller and extends down to
      stabilizerExpansionOffset from the bottom edge.
    constraints:
      requires:
        - parameter: stabilizers
          condition: "stabilizers = true"

  - name: stabilizerExpansionOffset
    group: print_helpers
    type: float
    unit: mbu
    default: 1
    ai_usage: rarely
    description: |
      Distance of expanded grid elements from the bottom edge.
    constraints:
      requires:
        - parameter: stabilizerExpansion
          condition: "stabilizerExpansion > 0"

  # --------------------------------------------------------------------------
  # GROUP: Pillars
  # --------------------------------------------------------------------------

  - name: pillars
    group: pillars
    type: bool_or_array
    format: |
      Boolean: true (all on) or false (all off).
      Selective array: [default_bool, [x1,y1,x2,y2,bool], ...]
      Coordinates reference stud grid from (0,0) in x+/y+ direction.
    unit: dimensionless
    default: true
    ai_usage: yes
    description: |
      Whether tubes/pins are drawn on the underside (baseCutoutType=standard).
    constraints:
      requires:
        - parameter: baseCutoutType
          condition: "baseCutoutType = 'standard'"
    example: |
      [false, [0,0,1,1,true]] — all off, but range (0,0)-(1,1) on
      [true, [0,1,2,2,false]] — all on, but range (0,1)-(2,2) off

  # --------------------------------------------------------------------------
  # GROUP: Pins
  # --------------------------------------------------------------------------

  - name: pinDiameter
    group: pins
    type: float_or_auto
    unit: mbu
    default: "auto"
    ai_usage: rarely
    description: |
      Diameter of pins (small tubes) for bricks with size.x or size.y = 1.
      Automatically calculated.

  - name: pinDiameterAdjustment
    group: pins
    type: float
    unit: mm
    default: 0.0
    ai_usage: config_only
    description: |
      Calibration adjustment for pin diameter.

  # --------------------------------------------------------------------------
  # GROUP: Tubes
  # --------------------------------------------------------------------------

  - name: pillarOriginalWallThickness
    group: tubes
    type: float
    unit: mbu
    default: 0.53125
    ai_usage: never
    description: |
      Fixed constant used for automatic tube diameter calculation.
      Do not modify.
    version_history:
      - version: "2"
        description: "Named tubeWallThickness in V2."
      - version: "3.0"
        description: "Renamed to pillarOriginalWallThickness."

  - name: tubeDiameter
    group: tubes
    type: float_or_auto_or_array
    format: |
      "auto": automatically calculated for all axes.
      Number: applies to x, y, and z axes equally.
      2-element array [xy, z]: first value for x and y, second for z.
      3-element array [x, y, z]: each axis individually.
    unit: mbu
    default: "auto"
    ai_usage: never
    description: |
      Diameter of outer tubes for LEGO Technic holes.
      Automatically calculated per axis.
    version_history:
      - version: "2"
        description: "Three separate parameters: tubeXDiameter, tubeYDiameter, tubeZDiameter."
      - version: "3.0"
        description: "Consolidated into tubeDiameter with 1/2/3-value array rule."

  - name: tubeDiameterAdjustment
    group: tubes
    type: float_or_array
    format: |
      Number: applies to x, y, and z axes equally.
      2-element array [xy, z]: first value for x and y, second for z.
      3-element array [x, y, z]: each axis individually.
    unit: mm
    default: -0.1
    ai_usage: config_only
    description: |
      Calibration adjustment for tubeDiameter.
    version_history:
      - version: "2"
        description: "Three separate parameters: tubeXDiameterAdjustment, tubeYDiameterAdjustment, tubeZDiameterAdjustment."
      - version: "3.0"
        description: "Consolidated into tubeDiameterAdjustment with 1/2/3-value array rule."

  - name: pillarInnerClampThickness
    group: tubes
    type: float
    unit: mm
    default: 0.1
    ai_usage: rarely
    description: |
      Thickness of the clamp inside Z-direction tubes.
      A constriction of the inner hole so studs grip inside the tube.
      Usually does not need adjustment.
    version_history:
      - version: "2"
        description: "Named tubeInnerClampThickness in V2."
      - version: "3.0"
        description: "Renamed to pillarInnerClampThickness."

  # --------------------------------------------------------------------------
  # GROUP: Technic Holes X
  # --------------------------------------------------------------------------

  - name: holeX
    group: technic_holes_x
    type: bool_or_array
    format: |
      Boolean or selective array (same format as pillars/studs).
      Last value in selective array can be "pin"|"axle"|true|false.
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether LEGO Technic holes are drawn along the X-axis.
      Multiple rows possible depending on block height.

  - name: holeXYZType
    group: technic_holes
    type: enum_or_array
    values: ["pin", "axle"]
    format: |
      String: applies to x, y, and z axes equally.
      2-element array [xy, z]: first for x and y, second for z.
      3-element array [x, y, z]: each axis individually.
    unit: dimensionless
    default: "pin"
    ai_usage: yes
    description: |
      Type of Technic holes per axis.
      pin: round holes. axle: cross-shaped holes.
      Follows the 1/2/3-value array rule.
    version_history:
      - version: "2"
        description: "Three separate parameters: holeXType, holeYType, holeZType."
      - version: "3.0"
        description: "Consolidated into holeXYZType with 1/2/3-value array rule."

  - name: holeXYZShift
    group: technic_holes
    type: bool_or_array
    format: |
      Bool: applies to x, y, and z axes equally.
      2-element array [xy, z]: first for x and y, second for z.
      3-element array [x, y, z]: each axis individually.
    unit: dimensionless
    default: true
    ai_usage: yes
    description: |
      Whether Technic holes per axis are shifted by 1/2 stud.
      true: holes align with studs. false: holes sit between two studs.
      Follows the 1/2/3-value array rule.
    version_history:
      - version: "2"
        description: "Three separate parameters: holeXShift, holeYShift, holeZShift."
      - version: "3.0"
        description: "Consolidated into holeXYZShift with 1/2/3-value array rule."

  - name: holeXYZDiameter
    group: technic_holes
    type: float_or_auto_or_array
    format: |
      "auto": automatically calculated for all axes.
      Number: applies to x, y, and z equally.
      2-element array [xy, z]: first for x and y, second for z.
      3-element array [x, y, z]: each axis individually.
    unit: mbu
    default: "auto"
    ai_usage: rarely
    description: |
      Diameter of Technic holes per axis. Automatically calculated.
      Follows the 1/2/3-value array rule.
    version_history:
      - version: "2"
        description: "Three separate parameters: holeXDiameter, holeYDiameter, holeZDiameter."
      - version: "3.0"
        description: "Consolidated into holeXYZDiameter with 1/2/3-value array rule."

  - name: holeXYZDiameterAdjustment
    group: technic_holes
    type: float_or_array
    format: |
      Number: applies to x, y, and z equally.
      2-element array [xy, z]: first for x and y, second for z.
      3-element array [x, y, z]: each axis individually.
    unit: mm
    default: 0.3
    ai_usage: config_only
    description: |
      Calibration adjustment for holeXYZDiameter per axis.
      Follows the 1/2/3-value array rule.
    version_history:
      - version: "2"
        description: "Three separate parameters: holeXDiameterAdjustment, holeYDiameterAdjustment, holeZDiameterAdjustment."
      - version: "3.0"
        description: "Consolidated into holeXYZDiameterAdjustment with 1/2/3-value array rule."

  - name: holeXYZInsetThickness
    group: technic_holes
    type: float_or_array
    format: |
      Number: applies to x, y, and z equally.
      2-element array [xy, z]: first for x and y, second for z.
      3-element array [x, y, z]: each axis individually.
    unit: mbu
    default: 0.375
    ai_usage: rarely
    description: |
      Width of the inset ring around Technic holes, per axis.
      In V2, insets existed only for x and y holes. Z holes now also
      support insets.
      Follows the 1/2/3-value array rule.
    version_history:
      - version: "2"
        description: "Named holeXInsetThickness and holeYInsetThickness (no Z inset)."
      - version: "3.0"
        description: "Consolidated into holeXYZInsetThickness. Z axis now also supports inset."

  - name: holeXYZInsetThicknessAdjustment
    group: technic_holes
    type: float_or_array
    format: |
      Number: applies to x, y, and z equally.
      2-element array [xy, z]: first for x and y, second for z.
      3-element array [x, y, z]: each axis individually.
    unit: mm
    default: 0.0
    ai_usage: config_only
    description: |
      Calibration adjustment for holeXYZInsetThickness per axis.
      Follows the 1/2/3-value array rule.
    version_history:
      - version: "2"
        description: "Named holeXInsetThicknessAdjustment and holeYInsetThicknessAdjustment."
      - version: "3.0"
        description: "Consolidated into holeXYZInsetThicknessAdjustment."

  - name: holeXYZInsetDepth
    group: technic_holes
    type: float_or_array
    format: |
      Number: applies to x, y, and z equally.
      2-element array [xy, z]: first for x and y, second for z.
      3-element array [x, y, z]: each axis individually.
    unit: mbu
    default: 0.5
    ai_usage: rarely
    description: |
      Depth of the inset ring around Technic holes, per axis.
      Follows the 1/2/3-value array rule.
    version_history:
      - version: "2"
        description: "Named holeXInsetDepth and holeYInsetDepth (no Z inset)."
      - version: "3.0"
        description: "Consolidated into holeXYZInsetDepth. Z axis now also supports inset."

  - name: holeXYZInsetDepthAdjustment
    group: technic_holes
    type: float_or_array
    format: |
      Number: applies to x, y, and z equally.
      2-element array [xy, z]: first for x and y, second for z.
      3-element array [x, y, z]: each axis individually.
    unit: mm
    default: 0.0
    ai_usage: config_only
    description: |
      Calibration adjustment for holeXYZInsetDepth per axis.
      Follows the 1/2/3-value array rule.
    version_history:
      - version: "2"
        description: "Named holeXInsetDepthAdjustment and holeYInsetDepthAdjustment."
      - version: "3.0"
        description: "Consolidated into holeXYZInsetDepthAdjustment."

  - name: holeXYGridOffsetZ
    group: technic_holes
    type: float_or_array
    format: |
      Number: applies to both x and y holes equally.
      2-element array [x, y]: first for x holes, second for y holes.
    unit: mbu
    default: 3.625
    ai_usage: rarely
    description: |
      Distance from the block bottom to the center of the first row
      of Technic holes in X- and Y-direction.
      Each parameter can independently be a single value or a 2-element array.
    version_history:
      - version: "2"
        description: "Two separate parameters: holeXGridOffsetZ and holeYGridOffsetZ."
      - version: "3.0"
        description: "Consolidated into holeXYGridOffsetZ with optional [x, y] array."

  - name: holeXYGridOffsetZAdjustment
    group: technic_holes
    type: float_or_array
    format: |
      Number: applies to both x and y holes equally.
      2-element array [x, y]: first for x holes, second for y holes.
    unit: mm
    default: 0.0
    ai_usage: config_only
    description: |
      Calibration adjustment for holeXYGridOffsetZ.
    version_history:
      - version: "2"
        description: "Named holeXGridOffsetZAdjustment and holeYGridOffsetZAdjustment."
      - version: "3.0"
        description: "Consolidated into holeXYGridOffsetZAdjustment."

  - name: holeXYGridSizeZ
    group: technic_holes
    type: float_or_array
    format: |
      Number: applies to both x and y holes equally.
      2-element array [x, y]: first for x holes, second for y holes.
    unit: mbu
    default: 6
    ai_usage: rarely
    description: |
      Center-to-center distance between two rows of Technic holes
      in X- and Y-direction.
    version_history:
      - version: "2"
        description: "Named holeXGridSizeZ and holeYGridSizeZ."
      - version: "3.0"
        description: "Consolidated into holeXYGridSizeZ."

  - name: holeXYGridSizeZAdjustment
    group: technic_holes
    type: float_or_array
    format: |
      Number: applies to both x and y holes equally.
      2-element array [x, y]: first for x holes, second for y holes.
    unit: mm
    default: 0.0
    ai_usage: config_only
    description: |
      Calibration adjustment for holeXYGridSizeZ.
    version_history:
      - version: "2"
        description: "Named holeXGridSizeZAdjustment and holeYGridSizeZAdjustment."
      - version: "3.0"
        description: "Consolidated into holeXYGridSizeZAdjustment."

  - name: holeXYMinTopMargin
    group: technic_holes
    type: float_or_array
    format: |
      Number: applies to both x and y holes equally.
      2-element array [x, y]: first for x holes, second for y holes.
    unit: mbu
    default: 0.5
    ai_usage: rarely
    description: |
      Minimum distance between the block top and the topmost row of
      Technic holes in X- and Y-direction. Determines whether a row is drawn.
    version_history:
      - version: "2"
        description: "Named holeXMinTopMargin and holeYMinTopMargin."
      - version: "3.0"
        description: "Consolidated into holeXYMinTopMargin."

  - name: holeXPartialY
    group: technic_holes_x
    type: enum
    values: ["none", "start", "end"]
    unit: dimensionless
    default: "none"
    ai_usage: yes
    description: |
      Whether partial (half) Technic holes are drawn at the Y-axis edges
      for X-direction holes.
      start: half hole at the y- edge.
      end: half hole at the y+ edge.
    constraints:
      requires:
        - parameter: holeX
          condition: "holeX is not false"
    version_history:
      - version: "2"
        description: "Was part of holeXPartial which combined both Y and Z partial behavior."
      - version: "3.0"
        description: "Split from holeXPartial. Controls Y-axis partial holes for X-direction holes."

  - name: holeXPartialZ
    group: technic_holes_x
    type: enum
    values: ["none", "end"]
    unit: dimensionless
    default: "none"
    ai_usage: yes
    description: |
      Whether partial (half) Technic holes are drawn at the top (z+) edge
      for X-direction holes, creating open grooves/channels.
      end: open groove at the top edge.
    constraints:
      requires:
        - parameter: holeX
          condition: "holeX is not false"
    version_history:
      - version: "2"
        description: "Was part of holeXPartial."
      - version: "3.0"
        description: "Split from holeXPartial. Controls Z-axis (top) partial holes for X-direction holes."

  # --------------------------------------------------------------------------
  # GROUP: Technic Holes Y
  # --------------------------------------------------------------------------

  - name: holeY
    group: technic_holes_y
    type: bool_or_array
    format: |
      Boolean or selective array (same format as pillars/studs).
      Last value in selective array can be "pin"|"axle"|true|false.
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether LEGO Technic holes are drawn along the Y-axis.
      Multiple rows possible depending on block height.
      Type, shift, diameter, inset, and grid parameters are shared with
      holeX and holeZ via the holeXYZ* and holeXY* unified parameters.

  - name: holeYPartialX
    group: technic_holes_y
    type: enum
    values: ["none", "start", "end"]
    unit: dimensionless
    default: "none"
    ai_usage: yes
    description: |
      Whether partial (half) Technic holes are drawn at the X-axis edges
      for Y-direction holes.
      start: half hole at the x- edge.
      end: half hole at the x+ edge.
    constraints:
      requires:
        - parameter: holeY
          condition: "holeY is not false"
    version_history:
      - version: "2"
        description: "Was part of holeYPartial."
      - version: "3.0"
        description: "Split from holeYPartial. Controls X-axis partial holes for Y-direction holes."

  - name: holeYPartialZ
    group: technic_holes_y
    type: enum
    values: ["none", "end"]
    unit: dimensionless
    default: "none"
    ai_usage: yes
    description: |
      Whether partial (half) Technic holes are drawn at the top (z+) edge
      for Y-direction holes, creating open grooves/channels.
      end: open groove at the top edge.
    constraints:
      requires:
        - parameter: holeY
          condition: "holeY is not false"
    version_history:
      - version: "2"
        description: "Was part of holeYPartial."
      - version: "3.0"
        description: "Split from holeYPartial. Controls Z-axis (top) partial holes for Y-direction holes."

  # --------------------------------------------------------------------------
  # GROUP: Technic Holes Z
  # --------------------------------------------------------------------------

  - name: holeZ
    group: technic_holes_z
    type: bool_or_array
    format: |
      Boolean or selective array (same format as pillars/studs).
      Last value in selective array can be "pin"|"axle"|true|false.
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether LEGO Technic holes are drawn along the Z-axis.
      Type, shift, diameter, and inset parameters are shared with holeX
      and holeY via the holeXYZ* unified parameters.
      Z holes now also support insets (holeXYZInsetThickness/Depth).

  - name: holeZPartialX
    group: technic_holes_z
    type: enum
    values: ["none", "start", "end", "all"]
    unit: dimensionless
    default: "none"
    ai_usage: yes
    description: |
      Whether partial (half) Z-holes are drawn in X-direction.
      start: half hole at the x- edge.
      end: half hole at the x+ edge.
      all: both sides.
    constraints:
      requires:
        - parameter: holeZ
          condition: "holeZ is not false"

  - name: holeZPartialY
    group: technic_holes_z
    type: enum
    values: ["none", "start", "end", "all"]
    unit: dimensionless
    default: "none"
    ai_usage: yes
    description: |
      Whether partial (half) Z-holes are drawn in Y-direction.
      start: half hole at the y- edge.
      end: half hole at the y+ edge.
      all: both sides.
    constraints:
      requires:
        - parameter: holeZ
          condition: "holeZ is not false"

  # --------------------------------------------------------------------------
  # GROUP: Hole Axle
  # --------------------------------------------------------------------------

  - name: holeXYZAxleThickness
    group: technic_holes
    type: float_or_array
    format: |
      Number: applies to x, y, and z equally.
      2-element array [xy, z]: first for x and y, second for z.
      3-element array [x, y, z]: each axis individually.
    unit: mbu
    default: 1
    ai_usage: rarely
    description: |
      Thickness of one strut of the cross axle for holeXYZType="axle".
      Follows the 1/2/3-value array rule.
    constraints:
      requires:
        - condition: "Any of holeXYZType contains 'axle'"
    version_history:
      - version: "2"
        description: "Named holeAxleThickness in V2. Applied to all axes (X, Y, Z)."
      - version: "3.0"
        description: "Renamed to holeXYZAxleThickness with 1/2/3-value array rule."

  - name: holeXYZAxleThicknessAdjustment
    group: technic_holes
    type: float_or_array
    format: |
      Number: applies to x, y, and z equally.
      2-element array [xy, z]: first for x and y, second for z.
      3-element array [x, y, z]: each axis individually.
    unit: mm
    default: 0.0
    since: "3.0"
    status: stable
    ai_usage: config_only
    description: |
      Calibration adjustment for holeXYZAxleThickness, in mm.
      Follows the 1/2/3-value array rule.
      Analog to other Adjustment parameters for printer compensation.

  # --------------------------------------------------------------------------
  # GROUP: Studs
  # --------------------------------------------------------------------------

  - name: studs
    group: studs
    type: bool_or_array
    format: |
      Boolean or selective array (same format as pillars).
      Last value in selective array can be "hollow"|"solid"|true|false.
    unit: dimensionless
    default: true
    ai_usage: yes
    description: |
      Whether studs are drawn. Selective array allows per-region control
      including stud type override.

  - name: studType
    group: studs
    type: enum
    values: ["solid", "hollow"]
    unit: dimensionless
    default: "solid"
    ai_usage: yes
    description: |
      Type of studs. solid: massive. hollow: with a hole in the center.

  - name: studShift
    group: studs
    type: bool
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether studs are shifted by 1/2 stud in X and Y.
      false: studs sit between pillars.
      true: studs sit directly above pillars.

  - name: studMaxOverhang
    group: studs
    type: float
    unit: mbu
    default: 0.3
    ai_usage: rarely
    description: |
      Maximum allowed stud overhang beyond the outer edge.
      Studs exceeding this are not drawn.

  - name: studPadding
    group: studs
    type: float_or_array
    format: |
      Float: all 4 sides equal.
      2-element array [X, Y]: X for x-(0) and x+(1), Y for y-(2) and y+(3).
      4-element array [x-(0), x+(1), y-(2), y+(3)]: each side individually.
    unit: unitGrid
    default: 0
    ai_usage: yes
    description: |
      Padding from sides 0-3 inward. Shifts the outer wall for the decision
      whether studs are drawn, allowing outer studs to be hidden.

  - name: studClampHeight
    group: studs
    type: float
    unit: mbu
    default: 0.5
    ai_usage: yes
    description: |
      Height of the stud clamp ring at the upper stud edge.
      Creates a near-permanent connection between two bricks.
      Only active when studClampThickness > 0.
    constraints:
      requires:
        - parameter: studClampThickness
          condition: "studClampThickness > 0"

  - name: studClampThickness
    group: studs
    type: float
    unit: mbu
    default: 0.0
    ai_usage: yes
    description: |
      Thickness of the stud clamp ring. At 0 no clamp is active.

  - name: studHoleDiameter
    group: studs
    type: float_or_auto
    unit: mbu
    default: "auto"
    ai_usage: rarely
    description: |
      Diameter of the hole in studs (studType=hollow).
      Automatically calculated.
    constraints:
      requires:
        - parameter: studType
          condition: "studType = 'hollow'"

  - name: studHoleDiameterAdjustment
    group: studs
    type: float
    unit: mm
    default: 0.3
    ai_usage: config_only
    description: |
      Calibration adjustment for studHoleDiameter.

  - name: studHoleClampThickness
    group: studs
    type: float
    unit: mm
    default: 0.1
    ai_usage: rarely
    description: |
      Thickness of the clamp inside the stud hole (studType=hollow).
      A constriction of the inner hole so pins/axles grip in the stud.
    constraints:
      requires:
        - parameter: studType
          condition: "studType = 'hollow'"

  - name: studRounding
    group: studs
    type: float
    unit: mbu
    default: 0.0625
    ai_usage: rarely
    description: |
      Rounding radius of the upper stud edge.

  - name: studDiameter
    group: studs
    type: float
    unit: mbu
    default: 3
    ai_usage: rarely
    description: |
      Diameter of studs. Usually does not need adjustment.

  - name: studDiameterAdjustment
    group: studs
    type: float
    unit: mm
    default: 0.2
    ai_usage: config_only
    description: |
      Calibration adjustment for studDiameter.

  - name: studHeight
    group: studs
    type: float
    unit: mbu
    default: 1
    customizer_range: "[0:0.125:64]"
    ai_usage: rarely
    description: |
      Height of studs. Usually does not need adjustment.

  - name: studHeightAdjustment
    group: studs
    type: float
    unit: mm
    default: 0.0
    ai_usage: config_only
    description: |
      Calibration adjustment for studHeight.

  - name: studBaseOverlap
    group: studs
    type: float
    unit: mbu
    default: 0.25
    customizer_range: "[0:0.125:64]"
    ai_usage: yes
    description: |
      How deeply the stud is sunk into the block body (overlap with base).
      Ensures the stud is geometrically connected to the body (no floating geometry).
      Also prevents gaps when grille or surfacePattern is active.
      Can be set to 0 when a block has base=false but still renders studs
      (e.g. stud-only decorative layers in composite blocks).
    version_history:
      - version: "2"
        description: "Named studSink in V2."
      - version: "3.0"
        description: "Renamed to studBaseOverlap."

  - name: studCutoutDiameterAdjustment
    group: studs
    type: float
    unit: mm
    default: 0.2
    ai_usage: config_only
    description: |
      Calibration adjustment for stud cutout diameter.
      Affects cutouts for studs in baseCutoutType=studs and outer wall
      cutouts in round bricks for grid compatibility. Calibration only.
    version_history:
      - version: "2"
        description: "Was first element of studCutoutAdjustment [width, height]."
      - version: "3.0"
        description: "Split from studCutoutAdjustment into studCutoutDiameterAdjustment."

  - name: studCutoutHeightAdjustment
    group: studs
    type: float
    unit: mm
    default: 0.4
    ai_usage: config_only
    description: |
      Calibration adjustment for stud cutout height.
      Affects cutouts for studs in baseCutoutType=studs and outer wall
      cutouts in round bricks for grid compatibility. Calibration only.
    version_history:
      - version: "2"
        description: "Was second element of studCutoutAdjustment [width, height]."
      - version: "3.0"
        description: "Split from studCutoutAdjustment into studCutoutHeightAdjustment."

  # --------------------------------------------------------------------------
  # GROUP: Stud Icon
  # --------------------------------------------------------------------------

  - name: studIcon
    group: stud_icon
    type: string
    unit: dimensionless
    default: "../pattern/bolt-solid-full.svg"
    ai_usage: yes
    description: |
      SVG file engraved into each stud.

  - name: studIconDimensions
    group: stud_icon
    type: array
    format: "[width, height]"
    unit: mm
    default: [169.333, 169.333]
    ai_usage: yes
    description: |
      Dimensions of the stud icon SVG in mm (from the SVG file).
      Default values match all standard icons in the /patterns directory.

  - name: studIconScale
    group: stud_icon
    type: float
    unit: dimensionless
    default: 0.024
    ai_usage: yes
    description: |
      Effective scale factor for the stud icon.

  - name: studIconDepth
    group: stud_icon
    type: float
    unit: mm
    default: -0.2
    ai_usage: yes
    description: |
      Depth of the icon engraving. Negative = engraved into the stud.
      Positive = raised above the stud.

  - name: studIconColor
    group: stud_icon
    type: color_or_inherit
    unit: dimensionless
    default: "inherit"
    ai_usage: yes
    description: |
      Color of the stud icon. "inherit" uses baseColor.
      Only visually relevant when studIconDepth > 0.

  # --------------------------------------------------------------------------
  # GROUP: Tongue / Groove
  # --------------------------------------------------------------------------

  - name: tongue
    group: tongue_groove
    type: bool
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether a tongue (ridge) is drawn. Counterpart to baseCutoutType=groove.
      Tongue and groove are an alternative attachment system for joining two
      bricks, typically to create a solid block from two separate parts.
      The tongue wraps around the outermost ring of studs and is compatible
      with a plate of the same size, but typically used with a groove brick.
      Can be used with or without recess.

  - name: tongueHeight
    group: tongue_groove
    type: float
    unit: mbu
    default: 1.25
    ai_usage: rarely
    description: |
      Height of the tongue.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  # tongueGrooveDepth removed in V3 — see removed_in_v3 section.
  # Replaced by tongueGrooveDepthClearance.

  - name: tongueRoundingRadius
    group: tongue_groove
    type: float_or_auto
    unit: unitGrid
    default: "auto"
    ai_usage: rarely
    description: |
      Rounding radius of the tongue. Typically derived from the block's
      rounding radius. Usually does not need adjustment.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  # tongueInnerRoundingRadius removed in V3 — see removed_in_v3 section.

  - name: tongueThickness
    group: tongue_groove
    type: float
    unit: mbu
    default: 0.666
    ai_usage: rarely
    description: |
      Thickness of the tongue.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  - name: tongueThicknessAdjustment
    group: tongue_groove
    type: float
    unit: mm
    default: 0
    ai_usage: config_only
    description: |
      Calibration adjustment for tongue thickness. Adjusts the thickness
      of the tongue only (not the groove). Used when using a tongue with
      a non-groove partner brick. Does not affect tongueClampThickness.
      For groove clearance, use tongueGrooveThicknessClearance instead.

  - name: tongueOffset
    group: tongue_groove
    type: float
    unit: mbu
    default: 1
    ai_usage: rarely
    description: |
      Distance of the tongue from the side edge.
      Corresponds to the distance of studs from the side edge.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  - name: tongueClampHeight
    group: tongue_groove
    type: float
    unit: mbu
    default: 0.5
    ai_usage: rarely
    description: |
      Height of the tongue clamp lip. Affects both the lip on the tongue
      and the matching recess in the groove for snapping together.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  - name: tongueClampOffset
    group: tongue_groove
    type: float
    unit: mbu
    default: 0.25
    ai_usage: rarely
    description: |
      Distance from the lower edge of the tongue to the lower edge of
      the tongue clamp lip. Also affects the groove's clamp recess position.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"
    version_history:
      - version: "2"
        description: "Measured from the upper edge of the tongue to the upper edge of the clamp lip."
      - version: "3.0"
        description: |
          Now measured from the lower edge of the tongue to the lower edge of
          the clamp lip. Changed so that groove users do not need to account
          for the difference in groove depth vs. tongue height.

  - name: tongueClampThickness
    group: tongue_groove
    type: float
    unit: mm
    default: 0.1
    ai_usage: rarely
    description: |
      Thickness of the tongue clamp lip / groove recess.
    constraints:
      requires:
        - parameter: tongue
          condition: "tongue = true"

  - name: tongueGrooveDepthClearance
    group: tongue_groove
    type: float_or_auto
    unit: mbu
    default: 0.2
    since: "3.0"
    status: stable
    ai_usage: config_only
    description: |
      Additional depth clearance above the tongue inside the groove.
      The effective groove depth = tongueHeight + tongueGrooveDepthClearance.
      Replaces the old tongueGrooveDepth parameter.
      "auto" uses printerLayerHeight.
    constraints:
      requires:
        - parameter: baseCutoutType
          condition: "baseCutoutType = 'groove'"

  - name: tongueGrooveThicknessClearance
    group: tongue_groove
    type: float_or_auto
    unit: mm
    default: 0.1
    since: "3.0"
    status: stable
    ai_usage: config_only
    description: |
      Clearance added to the groove width to allow the tongue to fit.
      Applied to both the groove wall thickness and tongueClampThickness
      inside the groove. Unlike tongueThicknessAdjustment (which only adjusts
      the tongue itself and not the clamp), this parameter adjusts the groove side
      including the clamp recess.
      "auto" uses 0.25 * printerNozzleDiameter (minimum 0.1 mm).
    constraints:
      requires:
        - parameter: baseCutoutType
          condition: "baseCutoutType = 'groove'"

  - name: tongueGrooveClampOffsetClearance
    group: tongue_groove
    type: float_or_auto
    unit: mbu
    default: 0
    since: "3.0"
    status: stable
    ai_usage: config_only
    description: |
      Extra clearance in the groove before the clamp recess. In the groove,
      both tongueClampOffset and tongueClampHeight are increased by this value,
      so the clamp snaps more easily into the groove recess.
      "auto" uses printerLayerHeight.
    constraints:
      requires:
        - parameter: baseCutoutType
          condition: "baseCutoutType = 'groove'"

  # --------------------------------------------------------------------------
  # GROUP: Grille
  # --------------------------------------------------------------------------

  - name: grille
    group: grille
    type: enum
    values: ["none", "x", "y"]
    unit: dimensionless
    default: "none"
    ai_usage: yes
    description: |
      Whether the top plate is rendered as a grille with regular openings.
      "x" or "y" defines the direction of the grille bars.

  - name: grilleInverted
    group: grille
    type: bool
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether the grille starts with an opening instead of a solid bar.
    constraints:
      requires:
        - parameter: grille
          condition: "grille is not 'none'"

  - name: grilleDepth
    group: grille
    type: float
    unit: mbu
    default: 1
    ai_usage: yes
    description: |
      Depth of the grille openings.
    constraints:
      requires:
        - parameter: grille
          condition: "grille is not 'none'"

  - name: grilleCount
    group: grille
    type: int
    unit: dimensionless
    default: 5
    ai_usage: yes
    description: |
      Number of grille bars across the entire surface.
    constraints:
      requires:
        - parameter: grille
          condition: "grille is not 'none'"

  # --------------------------------------------------------------------------
  # GROUP: Recess
  # --------------------------------------------------------------------------

  - name: recess
    group: recess
    type: bool
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether a top-down cavity is created, forming a box with four walls
      and no lid. When active with baseCutoutType=standard, the baseCutout
      depth is reduced to minimum (1 mbu) if recessDepth=auto.

  - name: recessRoundingRadius
    group: recess
    type: float_or_auto
    unit: unitGrid
    default: "auto"
    ai_usage: rarely
    description: |
      Rounding radius of the recess cavity. Derived from the block's
      rounding radius. Usually does not need adjustment.
    constraints:
      requires:
        - parameter: recess
          condition: "recess = true"

  - name: recessDepth
    group: recess
    type: float_or_auto
    unit: unitGrid[1] (plates)
    default: "auto"
    since: "2"
    status: stable
    ai_usage: yes
    description: |
      Depth of the recess cavity, expressed as multiples of one plate (unitGrid[1] = 2 mbu).
      At "auto" depth is maximized.
      When set to an absolute value, the baseCutout (standard) goes up to
      baseCutoutMaxDepth and the remainder is filled with the top plate
      wall between baseCutout and recess.
    constraints:
      requires:
        - parameter: recess
          condition: "recess = true"
    version_history:
      - version: "3.0"
        description: "Unit clarified: recessDepth is in unitGrid[1] (plates), not raw mbu."

  - name: recessWallThickness
    group: recess
    type: float_or_array
    format: |
      Float: all 4 sides equal.
      2-element array [X, Y]: X for x-(0) and x+(1), Y for y-(2) and y+(3).
      4-element array [x-(0), x+(1), y-(2), y+(3)]: each side individually.
    unit: unitGrid
    default: 0.333
    ai_usage: yes
    description: |
      Wall thickness of the recess cavity (box wall thickness).
    constraints:
      requires:
        - parameter: recess
          condition: "recess = true"

  - name: recessStuds
    group: recess
    type: bool
    unit: dimensionless
    default: true
    ai_usage: yes
    description: |
      Whether studs are drawn on the recess floor. Studs are at the same
      X/Y position as without recess. Only drawn if a 1x1 brick fits —
      studs too close to the recess wall are hidden.
    constraints:
      requires:
        - parameter: recess
          condition: "recess = true"

  - name: recessStudPadding
    group: recess
    type: float_or_array
    format: |
      Float: all 4 sides equal.
      2-element array [X, Y]: X for x-(0) and x+(1), Y for y-(2) and y+(3).
      4-element array [x-(0), x+(1), y-(2), y+(3)]: each side individually.
    unit: unitGrid
    default: 0.2
    ai_usage: yes
    description: |
      Padding from the recess wall inward. Determines whether outer studs
      in the recess are hidden. Studs whose center is closer to the recess
      wall than this padding value are not drawn.
    constraints:
      requires:
        - parameter: recessStuds
          condition: "recessStuds = true"

  - name: recessStudType
    group: recess
    type: enum
    values: ["solid", "hollow"]
    unit: dimensionless
    default: "solid"
    ai_usage: yes
    description: |
      Type of studs on the recess floor.
      solid: massive studs. hollow: studs with a hole in the center.
    constraints:
      requires:
        - parameter: recessStuds
          condition: "recessStuds = true"

  - name: recessStudShift
    group: recess
    type: bool
    unit: dimensionless
    default: false
    ai_usage: yes
    description: |
      Whether recess floor studs are shifted by 1/2 stud in X and Y.
      false: studs sit at standard positions.
      true: studs are shifted by half a stud in both directions.
    constraints:
      requires:
        - parameter: recessStuds
          condition: "recessStuds = true"

  - name: recessWallGaps
    group: recess
    type: array
    format: |
      Short form — single side, full opening:
        Integer:      recessWallGaps = 0  (side 0 fully open)
        String:       recessWallGaps = "x-"  (same, using string side)
        1-element:    recessWallGaps = [0]  or  ["x-"]
        Multi-side:   recessWallGaps = ["x+", "y-"]
      Full form — with left/right offsets (internal format):
        [[side, offset_left, offset_right], ...]
        offsets are in unitGrid; 0 = full opening on that side.
      Short forms are internally expanded to the full format.
    unit: "side: side index (0-3) or string ("x-" etc.), offsets: unitGrid"
    default: []
    since: "2"
    status: stable
    ai_usage: yes
    description: |
      Openings in recess walls. Each entry specifies a side and optional
      left/right offsets to create partial or full wall openings.
      Also creates matching openings in tongue and groove.
    constraints:
      requires:
        - parameter: recess
          condition: "recess = true"
      affects:
        - tongue
        - baseCutoutType (groove)
    example: |
      Short:  recessWallGaps = "x+"          — side x+ fully open
      Short:  recessWallGaps = ["x+", "y-"]  — two sides fully open
      Full:   [["x-", 1, 2], ["y+", 0, 1]]  — partial openings with offsets
    version_history:
      - version: "2"
        description: "Full format only: [[side, offset_left, offset_right], ...]"
      - version: "3.0"
        description: |
          Short forms added: integer, string, or flat array of sides for fully open walls.
          Sides can now be specified as strings ("x-", "x+", "y-", "y+").
          Short forms are expanded to the internal full format automatically.


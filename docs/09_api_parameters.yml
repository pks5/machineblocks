# ============================================================================
# COMPOSITE BLOCK PARAMETERS
# ============================================================================
# These parameters are native parameters recognized by the system, but are
# intentionally IGNORED by mb_block(). They are only meaningful in composite
# block modules, which must implement their behavior explicitly.
# ============================================================================

composite_block_parameters:

  - name: assembly
    group: composite
    type: string_or_array
    format: |
      String format:
        "unassembled" | "assembled" | "merged"

      Array format (required when this block is itself a child of another
      composite block):
        [mode, [sX, sY, sZ], direction]
        - mode: "unassembled" | "assembled" | "merged"
        - [sX, sY, sZ]: direction-resolved size of the outer composite block
        - direction: aggregated direction through the full block tree (int or string)
    unit: dimensionless
    default: "assembled"
    since: "3.0"
    status: stable
    ai_usage: yes
    description: |
      Controls the visualization mode of a composite block.
      Must be actively implemented by composite block modules.
      mb_block() ignores this parameter.

      unassembled: parts are laid out individually for printing,
        spaced 4mm apart along X-axis.
      assembled: parts shown in connected position including internal geometry.
      merged: parts fused into a single body; tongue/groove and internal
        voids are suppressed.

      Always resolve via mb_assembly(config, settings, size, direction).
      Always check mode via assembly[0] after resolution.

      The array format is required when this composite block is itself
      used as a child inside another composite block. The size and direction
      in the array are used to correctly position unassembled parts.
      mb_assembly() handles this propagation automatically.

  - name: renderGroups
    group: composite
    type: string_or_array
    format: |
      String: "all" — all render groups are rendered.
      String: group name — only that specific group is rendered.
      Array of strings: ["bottom", "top"] — only listed groups are rendered.
      "all" is a reserved value that always renders every group.
    unit: dimensionless
    default: "all"
    since: "3.0"
    status: stable
    ai_usage: yes
    description: |
      Controls which named render groups of a composite block are rendered.
      A render group is a named set of semantically related parts within a
      composite block. Group names may be identical to part names (common in
      simple composite blocks) but do not have to be.

      Part Name: the unique name of a block within the wrapper block.
      Group Name: the unique name of a render group within the wrapper block.
      The wrapper block itself is neither a part nor belongs to any render group.

      Used together with the render parameter and mb_group_render().
      mb_block() ignores this parameter; it must be implemented in composite modules.

      Usage:
        renderGroups = mb_param_renderGroups(config, settings);
        // Then per part, passing the group name:
        ["render", mb_group_render(renderGroups, group_bottom)]
        ["render", mb_group_render(renderGroups, group_top)]

      mb_group_render(renderGroups, g, solo=false):
        Returns true if group g should be rendered.
        solo=true: returns true only if renderGroups contains ONLY this group.

      Assembly helpers use group names, not part names:
        mb_assembly_tongue(assembly, renderGroups, g)
        mb_assembly_groove(assembly, renderGroups, g)
        mb_assembly_offset(offset, assembly, renderGroups, g)

      Convention in composite block modules:
        group_bottom = "bottom";
        group_top = "top";
        part_bottom = "bottom";  // may be identical to group name
        ns_bottom = part_bottom; // namespace for mb_params_filter

      Group variables should be defined before part variables when groups
      differ from parts.


